<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SiKoyek V1.0 — Progress</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="app-shell.css"></head><body><script src="app-shell.js"></script><script>
(async()=>{if(!await SK.requireSession())return;const root=SK.mountModule('Progress','Input progress tambahan per item pekerjaan. Total item maksimal 100%.','progress');root.innerHTML='<div class="card"><div class="grid"><div class="field"><label>Proyek</label><select id="project"><option value="">Pilih proyek</option></select></div><div class="field"><label>Item Pekerjaan</label><select id="work"><option value="">Pilih item pekerjaan</option></select></div><div class="field"><label>Tanggal Progress</label><input id="date" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div><div class="field"><label>Progress Tambahan (%)</label><input id="inc" type="number" min="0.01" max="100" step="0.01" placeholder="Contoh: 10"></div></div><button id="save" class="btn primary">Simpan Progress</button><div id="msg" class="msg"></div></div><div class="card"><div class="top"><div><h2 style="margin:0">Progress per Item</h2><div class="note">Bobot ditampilkan sebagai persen. Progress tersimpan sebagai nilai persentase 0–100.</div></div><strong id="projectProgress">Project Progress: 0.00%</strong></div><div class="tablewrap"><table class="table"><thead><tr><th>Item Pekerjaan</th><th>Bobot</th><th>Progress Terkumpul</th><th>Visual</th></tr></thead><tbody id="rows"><tr><td colspan="4">Pilih proyek.</td></tr></tbody></table></div></div>';
const project=document.getElementById('project'),work=document.getElementById('work'),date=document.getElementById('date'),inc=document.getElementById('inc'),save=document.getElementById('save'),msg=document.getElementById('msg'),rows=document.getElementById('rows'),projectProgress=document.getElementById('projectProgress');let items=[];
const {data:ps,error:pe}=await SK.sb.from('projects').select('id,project_code,project_name').order('project_code');if(pe){msg.className='msg err';msg.textContent=pe.message;return}(ps||[]).forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=p.project_code+' — '+p.project_name;project.appendChild(o)});project.addEventListener('change',loadItems);save.addEventListener('click',saveProgress);
async function loadItems(){items=[];work.innerHTML='<option value="">Pilih item pekerjaan</option>';if(!project.value){rows.innerHTML='<tr><td colspan="4">Pilih proyek.</td></tr>';projectProgress.textContent='Project Progress: 0.00%';return}const {data,error}=await SK.sb.from('project_work_items').select('id,work_name,weight,sort_order').eq('project_id',project.value).order('sort_order');if(error){msg.className='msg err';msg.textContent=error.message;return}items=data||[];items.forEach(i=>{const o=document.createElement('option');o.value=i.id;o.textContent=i.work_name+' — Bobot '+(Number(i.weight||0)*100).toFixed(2)+'%';work.appendChild(o)});await refresh()}
async function refresh(){if(!project.value)return;const {data,error}=await SK.sb.from('progress_records').select('work_item_id,progress_percentage').eq('project_id',project.value);if(error){msg.className='msg err';msg.textContent=error.message;return}const totals={};(data||[]).forEach(r=>totals[r.work_item_id]=(totals[r.work_item_id]||0)+Number(r.progress_percentage||0));rows.innerHTML=items.map(i=>{const t=totals[i.id]||0;return `<tr><td>${SK.esc(i.work_name)}</td><td>${(Number(i.weight||0)*100).toFixed(2)}%</td><td>${t.toFixed(2)}%</td><td><div class="bar"><i style="width:${Math.min(t,100)}%"></i></div></td></tr>`}).join('')||'<tr><td colspan="4">Belum ada item.</td></tr>';const pp=items.reduce((s,i)=>s+Number(i.weight||0)*((totals[i.id]||0)/100),0)*100;projectProgress.textContent='Project Progress: '+pp.toFixed(2)+'%'}
async function saveProgress(){msg.className='msg';msg.textContent='';const pid=project.value,wid=work.value,d=date.value,val=Number(inc.value);if(!pid||!wid||!d||!(val>0)){msg.className='msg err';msg.textContent='Lengkapi proyek, item, tanggal, dan progress tambahan.';return}try{const {data,error}=await SK.sb.from('progress_records').select('progress_percentage').eq('work_item_id',wid);if(error)throw error;const total=(data||[]).reduce((s,r)=>s+Number(r.progress_percentage||0),0);const remaining=Math.max(0,100-total);if(val>remaining){msg.className='msg err';msg.textContent='Progress item tersisa '+remaining.toFixed(2)+'%. Input '+val.toFixed(2)+'% melebihi batas.';return}const {data:{user}}=await SK.sb.auth.getUser();const {error:e}=await SK.sb.from('progress_records').insert({project_id:pid,work_item_id:wid,progress_date:d,progress_percentage:val,updated_by:user?.id||null});if(e)throw e;msg.className='msg ok';msg.textContent='Progress berhasil disimpan.';inc.value='';await refresh()}catch(e){msg.className='msg err';msg.textContent=e.message}}
})();
</script></body></html>
