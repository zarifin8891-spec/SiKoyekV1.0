<!doctype html>
<html lang="id">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SiKoyek V1.0 — Progress Engine</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Inter,system-ui,sans-serif;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:1100px;margin:0 auto;padding:24px}.card{background:#fff;border:1px solid #e5eaf1;border-radius:16px;padding:20px;margin-bottom:16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:11px;border:1px solid #d6dce6;border-radius:10px;box-sizing:border-box;background:#fff}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:#245cff;color:#fff}.muted{color:#687386;font-size:13px}.err{color:#c73737;font-size:13px;margin-top:8px}.ok{color:#11875d;font-size:13px;margin-top:8px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid #e5eaf1;text-align:left;font-size:13px}.bar{height:8px;background:#edf1f6;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#245cff}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head>
<body><div class="wrap"><div id="app"></div></div><script>
const URL='https://mmkusplegmittrlxqxby.supabase.co';const KEY='sb_publishable_m9qLt2yxWi6i40bo9ixR5A_QIbOLoyf';const sb=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true}});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let projects=[],items=[];
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){renderLogin();return}await loadProjects();render();}
function renderLogin(){app.innerHTML='<div class="card"><h1>SiKoyek V1.0</h1><p class="muted">Login untuk Progress Engine</p><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Password</label><input id="password" type="password"></div><button class="btn primary" onclick="login()">Masuk</button><div id="msg" class="err"></div></div>'}
async function login(){const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)msg.textContent=error.message;else boot()}
async function loadProjects(){const {data,error}=await sb.from('projects').select('id,project_code,project_name').order('project_code');if(error)throw error;projects=data||[]}
async function loadItems(){const project_id=project.value;items=[];if(!project_id)return;const {data,error}=await sb.from('project_work_items').select('id,work_name,weight,sort_order').eq('project_id',project_id).order('sort_order');if(error){msg.textContent=error.message;return}items=data||[];renderItemOptions()}
async function currentTotal(id){const {data,error}=await sb.from('progress_records').select('progress_percentage').eq('work_item_id',id);if(error)throw error;return (data||[]).reduce((s,r)=>s+Number(r.progress_percentage||0),0)}
async function refreshTable(){const pid=project.value;if(!pid)return;const {data,error}=await sb.from('progress_records').select('work_item_id,progress_percentage,progress_date').eq('project_id',pid).order('progress_date',{ascending:false});if(error){msg.textContent=error.message;return}const totals={};(data||[]).forEach(r=>totals[r.work_item_id]=(totals[r.work_item_id]||0)+Number(r.progress_percentage||0));const rows=items.map(i=>{const t=totals[i.id]||0;return '<tr><td>'+esc(i.work_name)+'</td><td>'+Number(i.weight).toFixed(2)+'%</td><td>'+t.toFixed(2)+'%</td><td><div class="bar"><i style="width:'+Math.min(t,100)+'%"></i></div></td></tr>'}).join('');document.getElementById('rows').innerHTML=rows||'<tr><td colspan="4">Belum ada item.</td></tr>';document.getElementById('totalProgress').textContent='Project Progress: '+items.reduce((s,i)=>s+(Number(i.weight)*((totals[i.id]||0)/100)),0).toFixed(2)+'%'}
function renderItemOptions(){work.innerHTML='<option value="">Pilih item pekerjaan</option>'+items.map(i=>'<option value="'+i.id+'">'+esc(i.work_name)+' — Bobot '+Number(i.weight).toFixed(2)+'%</option>').join('');refreshTable()}
async function saveProgress(){msg.textContent='';ok.textContent='';const project_id=project.value,work_item_id=work.value,date=progress_date.value,inc=Number(progress_increment.value);if(!project_id||!work_item_id||!date||!(inc>0)){msg.textContent='Lengkapi proyek, item, tanggal, dan progress tambahan.';return}try{const total=await currentTotal(work_item_id);const remaining=Math.max(0,100-total);if(inc>remaining){msg.textContent='Progress item tersisa '+remaining.toFixed(2)+'%. Input '+inc.toFixed(2)+'% melebihi batas.';return}const {data:{user}}=await sb.auth.getUser();const {error}=await sb.from('progress_records').insert({project_id,work_item_id,progress_date:date,progress_percentage:inc,updated_by:user?.id||null});if(error)throw error;ok.textContent='Progress berhasil disimpan.';progress_increment.value='';await refreshTable()}catch(e){msg.textContent=e.message}}
function render(){app.innerHTML='<div class="card"><div class="top"><div><h1>Progress Engine</h1><p class="muted">Input progress tambahan per item pekerjaan. Total setiap item tidak boleh melebihi 100%.</p></div><button class="btn" onclick="sb.auth.signOut().then(()=>location.reload())">Keluar</button></div></div><div class="card"><div class="grid"><div class="field"><label>Proyek</label><select id="project" onchange="loadItems()"><option value="">Pilih proyek</option>'+projects.map(p=>'<option value="'+p.id+'">'+esc(p.project_code)+' — '+esc(p.project_name)+'</option>').join('')+'</select></div><div class="field"><label>Item Pekerjaan</label><select id="work"><option value="">Pilih item pekerjaan</option></select></div><div class="field"><label>Tanggal Progress</label><input id="progress_date" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div><div class="field"><label>Progress Tambahan (%)</label><input id="progress_increment" type="number" min="0.01" max="100" step="0.01" placeholder="Contoh: 10"></div></div><button class="btn primary" onclick="saveProgress()">Simpan Progress</button><div id="msg" class="err"></div><div id="ok" class="ok"></div></div><div class="card"><div class="top"><h2>Progress per Item</h2><strong id="totalProgress">Project Progress: 0.00%</strong></div><div style="overflow:auto"><table class="table"><thead><tr><th>Item Pekerjaan</th><th>Bobot</th><th>Progress Terkumpul</th><th>Visual</th></tr></thead><tbody id="rows"><tr><td colspan="4">Pilih proyek.</td></tr></tbody></table></div></div>'}
boot();
</script></body></html>
