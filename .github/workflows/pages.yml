name: Deploy SiKoyek V1.0

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify canonical assets
        shell: python
        run: |
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          required = [
              'data-master-data-nav',
              'ui-form-fixes-v3.js?v=3',
              'ui-form-fixes-v3.css?v=3',
              'ui-form-pass5.js?v=2',
              'ui-form-pass5.css?v=2',
              'ui-form-pass6.js?v=2',
              'ui-form-pass6.css?v=2',
              'ui-form-pass7.js?v=1',
              'ui-form-pass7.css?v=1',
              'ui-form-pass8.js?v=1',
              'ui-form-pass8.css?v=1',
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit(f'Missing canonical Dashboard assets: {missing}')
          print('Canonical Dashboard artifact verified.')
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
