name: Deploy SiKoyek V1.0

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Expose authenticated client to presentation helpers
        shell: python
        run: |
          from pathlib import Path
          path=Path('index.html')
          html=path.read_text(encoding='utf-8')
          marker="const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});"
          if marker in html and 'window.__siKoyekSupabase=sb;' not in html:
            html=html.replace(marker, marker+'\nwindow.__siKoyekSupabase=sb;', 1)
          path.write_text(html,encoding='utf-8')
      - name: Add period performance module
        shell: python
        run: |
          from pathlib import Path
          import re
          path=Path('index.html');html=path.read_text(encoding='utf-8')
          html=re.sub(r'<script src="\\./period-performance\\.js\\?v=\\d+"></script>','',html)
          html=html.replace('</body>','<script src="./period-performance.js?v=2"></script></body>',1)
          path.write_text(html,encoding='utf-8')
      - name: Add dashboard graphs module
        shell: python
        run: |
          from pathlib import Path
          import re
          path=Path('index.html');html=path.read_text(encoding='utf-8')
          for asset in ['dashboard-graphs.js','dashboard-graphs-ui-fix.js','detail-finance-kpi.js']:
            html=re.sub(r'<script src="\\./'+re.escape(asset)+r'\\?v=\\d+"></script>','',html)
          html=html.replace('</body>','<script src="./dashboard-graphs.js?v=6"></script><script src="./dashboard-graphs-ui-fix.js?v=1"></script><script src="./detail-finance-kpi.js?v=1"></script></body>',1)
          path.write_text(html,encoding='utf-8')
      - name: Add cost control reconciliation module
        shell: python
        run: |
          from pathlib import Path
          import re
          path=Path('index.html');html=path.read_text(encoding='utf-8')
          html=re.sub(r'<script src="\\./cost-control-audit\\.js\\?v=\\d+"></script>','',html)
          html=html.replace('</body>','<script src="./cost-control-audit.js?v=1"></script></body>',1)
          path.write_text(html,encoding='utf-8')
      - name: Add RAP validation module
        shell: python
        run: |
          from pathlib import Path
          import re
          path=Path('index.html');html=path.read_text(encoding='utf-8')
          html=re.sub(r'<script src="\\./rap-control-validation\\.js\\?v=\\d+"></script>','',html)
          html=html.replace('</body>','<script src="./rap-control-validation.js?v=1"></script></body>',1)
          path.write_text(html,encoding='utf-8')
      - name: Add dashboard data fallback module
        shell: python
        run: |
          from pathlib import Path
          import re
          path=Path('index.html');html=path.read_text(encoding='utf-8')
          html=re.sub(r'<script src="\\./dashboard-data-fallback-v1\\.js\\?v=\\d+"></script>','',html)
          html=html.replace('</body>','<script src="./dashboard-data-fallback-v1.js?v=1"></script></body>',1)
          path.write_text(html,encoding='utf-8')
      - name: Add Health Engine Dashboard integration
        shell: python
        run: |
          from pathlib import Path
          import re
          path=Path('index.html');html=path.read_text(encoding='utf-8')
          html=re.sub(r'<script src="\\./health-dashboard-integration-v1\\.js\\?v=\\d+"></script>','',html)
          html=html.replace('</body>','<script src="./health-dashboard-integration-v1.js?v=5"></script></body>',1)
          path.write_text(html,encoding='utf-8')
      - name: Add Decision Engine Dashboard integration
        shell: python
        run: |
          from pathlib import Path
          import re
          path=Path('index.html');html=path.read_text(encoding='utf-8')
          html=re.sub(r'<script src="\\./decision-dashboard-integration-v1\\.js\\?v=\\d+"></script>','',html)
          html=html.replace('</body>','<script src="./decision-dashboard-integration-v1.js?v=4"></script></body>',1)
          path.write_text(html,encoding='utf-8')
      - name: Add UI/UX form modules through pass 8 stability
        shell: python
        run: |
          from pathlib import Path
          import re
          path=Path('index.html');html=path.read_text(encoding='utf-8')
          assets_css=['ui-revamp-v1.css','ui-form-polish-v2.css','ui-form-fixes-v3.css','ui-form-pass5.css','ui-form-pass6.css','ui-form-step1.css','ui-form-pass7.css','ui-form-pass8.css','master-data-v1.css','ui-cleanup-v1.css','dashboard-layout-v2.css','dashboard-final-fix.css','dashboard-header-kpi-v1.css']
          assets_js=['ui-revamp-v1.js','ui-input-revamp-v1.js','ui-form-fixes-v3.js','ui-form-pass5.js','ui-form-pass6.js','ui-form-step1.js','ui-form-pass7.js','ui-form-pass8.js','dashboard-layout-v2.js','dashboard-header-fix-v2.js']
          for asset in assets_css: html=re.sub(r'<link rel="stylesheet" href="\\./'+re.escape(asset)+r'\\?v=\\d+">','',html)
          for asset in assets_js: html=re.sub(r'<script src="\\./'+re.escape(asset)+r'\\?v=\\d+"></script>','',html)
          html=html.replace('</head>','<link rel="stylesheet" href="./ui-revamp-v1.css?v=1"><link rel="stylesheet" href="./ui-form-polish-v2.css?v=2"><link rel="stylesheet" href="./ui-form-fixes-v3.css?v=3"><link rel="stylesheet" href="./ui-form-pass5.css?v=2"><link rel="stylesheet" href="./ui-form-pass6.css?v=2"><link rel="stylesheet" href="./ui-form-step1.css?v=2"><link rel="stylesheet" href="./ui-form-pass7.css?v=1"><link rel="stylesheet" href="./ui-form-pass8.css?v=1"><link rel="stylesheet" href="./master-data-v1.css?v=1"><link rel="stylesheet" href="./ui-cleanup-v1.css?v=1"><link rel="stylesheet" href="./dashboard-layout-v2.css?v=7"><link rel="stylesheet" href="./dashboard-final-fix.css?v=7"><link rel="stylesheet" href="./dashboard-header-kpi-v1.css?v=4"></head>',1)
          html=html.replace('</body>','<script src="./ui-revamp-v1.js?v=1"></script><script src="./ui-input-revamp-v1.js?v=2"></script><script src="./ui-form-fixes-v3.js?v=3"></script><script src="./ui-form-pass5.js?v=2"></script><script src="./ui-form-pass6.js?v=2"></script><script src="./ui-form-step1.js?v=2"></script><script src="./ui-form-pass7.js?v=1"></script><script src="./ui-form-pass8.js?v=1"></script><script src="./master-data-v1.js?v=1"></script><script src="./dashboard-layout-v2.js?v=7"></script><script src="./dashboard-header-fix-v2.js?v=2"></script></body>',1)
          path.write_text(html,encoding='utf-8')
      - name: Add authoritative Dashboard lower panel override last
        shell: python
        run: |
          from pathlib import Path
          import re
          path=Path('index.html');html=path.read_text(encoding='utf-8')
          html=re.sub(r'<script src="\\./dashboard-final-override-v1\\.js\\?v=\\d+"></script>','',html)
          html=html.replace('</body>','<script src="./dashboard-final-override-v1.js?v=5"></script></body>',1)
          path.write_text(html,encoding='utf-8')
      - name: Apply clean approved Dashboard lower-panel layout
        shell: python
        run: |
          from pathlib import Path
          path=Path('index.html')
          html=path.read_text(encoding='utf-8')
          html=html.replace('>PERLU PENGAWASAN</div></div><div class="dashboard-status red">','>AWASI</div></div><div class="dashboard-status red">')
          html=html.replace('<h2>Project Health</h2><span class="note">Progress vs Cost Ratio &amp; RAP Consumption</span>','<h2>Kondisi Proyek</h2><span class="note">Progress vs Rasio Biaya &amp; RAP Terpakai</span>')
          html=html.replace('<h2>Kesehatan Proyek</h2><span class="note">Progress vs Rasio Biaya &amp; RAP Terpakai</span>','<h2>Kondisi Proyek</h2><span class="note">Progress vs Rasio Biaya &amp; RAP Terpakai</span>')
          html=html.replace('<span class="note">Rekomendasi berbasis Project Health</span>','<span class="note">Rekomendasi berbasis Kondisi Proyek</span>')
          html=html.replace('<span class="note">Rekomendasi berbasis Kesehatan Proyek</span>','<span class="note">Rekomendasi berbasis Kondisi Proyek</span>')
          css='''\n<style id="sikoyek-clean-lower-panels-v10">\n/* Clean final layout: the RIGHT table is the visual reference. The LEFT five data rows are explicit 64px grid tracks. */\n.dashboard-panels{display:grid!important;grid-template-columns:minmax(0,40fr) minmax(0,60fr)!important;gap:14px!important;align-items:start!important}\n.dashboard-panel{min-width:0!important;min-height:0!important;height:auto!important;box-sizing:border-box!important}\n.dashboard-panel .tablecard{min-height:0!important;height:auto!important;max-height:none!important;overflow:hidden!important}\n.dashboard-panel .scroll{height:auto!important;max-height:none!important;overflow:hidden!important}\n.dashboard-panel .table{width:100%!important;table-layout:fixed!important;border-collapse:collapse!important}\n.dashboard-panel .table th,.dashboard-panel .table td{font-size:10.5px!important;line-height:1.16!important;vertical-align:middle!important}\n.dashboard-panel .table th{font-size:8.5px!important;line-height:1.12!important;white-space:normal!important}\n.dashboard-panel:last-child .table th,.dashboard-panel:last-child .table td{padding:4px 9px!important}\n/* LEFT: use CSS grid for the five body rows because CSS table-row height is only a minimum in the browser table algorithm. */\n.dashboard-panel:first-child .table thead{display:block!important;width:100%!important}\n.dashboard-panel:first-child .table thead tr{display:grid!important;grid-template-columns:39% 13% 14% 19% 15%!important;width:100%!important}\n.dashboard-panel:first-child .table thead th{box-sizing:border-box!important;padding:5px 9px!important}\n.dashboard-panel:first-child .table tbody{display:grid!important;grid-template-rows:repeat(5,64px)!important;width:100%!important}\n.dashboard-panel:first-child .table tbody tr{display:grid!important;grid-template-columns:39% 13% 14% 19% 15%!important;grid-template-rows:64px!important;width:100%!important;height:64px!important;min-height:64px!important}\n.dashboard-panel:first-child .table tbody td{box-sizing:border-box!important;height:64px!important;min-height:64px!important;padding:4px 9px!important;white-space:normal!important}\n.dashboard-panel:first-child .table tbody td:nth-child(1){width:auto!important}\n/* RIGHT: keep the compact approved spacing. */\n.dashboard-panel:last-child .table tbody td:nth-child(1){width:29%!important;white-space:normal!important}\n.dashboard-panel:last-child .table tbody td:nth-child(2){width:11%!important}\n.dashboard-panel:last-child .table tbody td:nth-child(3){width:11%!important}\n.dashboard-panel:last-child .table tbody td:nth-child(4){width:24%!important;white-space:normal!important}\n.dashboard-panel:last-child .table tbody td:nth-child(5){width:25%!important;white-space:normal!important}\n/* Zebra reading aid. */\n.dashboard-panel .table tbody tr:nth-child(odd){background:#ffffff!important}\n.dashboard-panel .table tbody tr:nth-child(even){background:#eef4f9!important}\n.dashboard-panel .table tbody td{border-bottom:1px solid #dfe7ef!important}\n.dashboard-panel .table tbody tr:last-child td{border-bottom:0!important}\n.dashboard-panel .table tbody tr:hover{background:#e7eef5!important}\n@media(max-width:1100px){.dashboard-panels{grid-template-columns:1fr!important}.dashboard-panel:first-child .table thead,.dashboard-panel:first-child .table tbody{display:table-row-group!important}.dashboard-panel:first-child .table thead{display:table-header-group!important}.dashboard-panel:first-child .table thead tr,.dashboard-panel:first-child .table tbody tr{display:table-row!important;grid-template-columns:none!important;height:auto!important;min-height:0!important}.dashboard-panel:first-child .table tbody td{height:auto!important;min-height:0!important;padding:4px 9px!important}}\n</style>\n'''
          html=html.replace('</head>',css+'</head>',1)
          path.write_text(html,encoding='utf-8')
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
