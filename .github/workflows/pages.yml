name: Deploy SiKoyek V1.0

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Dashboard period performance
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'function periodPerformance(' not in s:
              css_old = '.periodnote{font-size:12px;color:var(--muted);margin-top:8px}'
              css_new = css_old + '.periodperf{margin-top:18px}.periodperf .cards{grid-template-columns:repeat(5,1fr)}.periodperf .tablecard{margin-top:12px}'
              s = s.replace(css_old, css_new, 1)
              state_old = "let state={page:'dashboard',summary:[],selected:null,detailTab:'overview',detail:null,search:'',period:{from:'',to:''}};"
              state_new = "let state={page:'dashboard',summary:[],selected:null,detailTab:'overview',detail:null,search:'',period:{from:'',to:''},periodData:{transactions:[],progress:[],weights:{}}};"
              s = s.replace(state_old, state_new, 1)
              load_old = "async function loadSummary(){const [{data,error},{data:projects,error:projectsError}]=await Promise.all([sb.from('project_summary').select('*').order('project_code'),sb.from('projects').select('id,project_date,start_date,end_date')]);if(error||projectsError){toast((error||projectsError).message);state.summary=[];return}const dates=Object.fromEntries((projects||[]).map(p=>[p.id,p]));state.summary=(data||[]).map(x=>({...x,...(dates[x.project_id]||{})}))}"
              load_new = "async function loadSummary(){const [{data,error},{data:projects,error:projectsError},{data:transactions,error:txError},{data:progress,error:prError},{data:workItems,error:wiError}]=await Promise.all([sb.from('project_summary').select('*').order('project_code'),sb.from('projects').select('id,project_date,start_date,end_date'),sb.from('financial_transactions').select('project_id,transaction_date,transaction_type,amount'),sb.from('progress_records').select('project_id,work_item_id,progress_date,progress_percentage'),sb.from('project_work_items').select('id,project_id,weight')]);if(error||projectsError||txError||prError||wiError){toast((error||projectsError||txError||prError||wiError).message);state.summary=[];return}const dates=Object.fromEntries((projects||[]).map(p=>[p.id,p]));const weights=Object.fromEntries((workItems||[]).map(x=>[x.id,Number(x.weight||0)]));state.summary=(data||[]).map(x=>({...x,...(dates[x.project_id]||{})}));state.periodData={transactions:transactions||[],progress:progress||[],weights}}"
              s = s.replace(load_old, load_new, 1)
              pattern = re.compile(r"function dashboard\(\)\{.*?\}\nfunction applyPreset", re.S)
              replacement = r'''function periodInRange(date){if(!date)return false;if(state.period.from&&date<state.period.from)return false;if(state.period.to&&date>state.period.to)return false;return true}
function periodPerformance(projects){const ids=new Set(projects.map(x=>x.project_id));const tx=(state.periodData.transactions||[]).filter(x=>ids.has(x.project_id)&&periodInRange(x.transaction_date));const pr=(state.periodData.progress||[]).filter(x=>ids.has(x.project_id)&&periodInRange(x.progress_date));const rows=projects.map(p=>{const t=tx.filter(x=>x.project_id===p.project_id);const cashIn=t.filter(x=>x.transaction_type==='MASUK').reduce((s,x)=>s+Number(x.amount||0),0);const cashOut=t.filter(x=>x.transaction_type==='KELUAR').reduce((s,x)=>s+Number(x.amount||0),0);const progress=pr.filter(x=>x.project_id===p.project_id).reduce((s,x)=>s+((state.periodData.weights[x.work_item_id]||0)*Number(x.progress_percentage||0)*100),0);return {...p,periodCashIn:cashIn,periodCashOut:cashOut,periodNet:cashIn-cashOut,periodProgress:progress}});const progressTotal=rows.reduce((s,x)=>s+x.periodProgress,0);return {rows,cashIn:rows.reduce((s,x)=>s+x.periodCashIn,0),cashOut:rows.reduce((s,x)=>s+x.periodCashOut,0),net:rows.reduce((s,x)=>s+x.periodNet,0),progressAverage:rows.length?progressTotal/rows.length:0}}
function dashboard(){const a=state.summary.filter(periodMatch),sum=k=>a.reduce((t,x)=>t+Number(x[k]||0),0),avg=a.length?sum('project_progress')/a.length:0,g=a.filter(x=>x.health_status==='SEHAT').length,w=a.filter(x=>x.health_status==='PERLU PENGAWASAN').length,r=a.filter(x=>x.health_status==='BERISIKO').length,pp=periodPerformance(a);return `<div class="top"><div><h1>Dashboard</h1><p>Ringkasan kondisi portfolio proyek.</p></div><div class="actions"><button class="btn primary" onclick="openProjectForm()">+ Proyek Baru</button><button class="btn ghost" onclick="logout()">Keluar</button></div></div><div class="card periodbar"><div class="periodrow"><div class="field"><label>Periode</label><select id="periodPreset" onchange="applyPreset(this.value)"><option value="">Pilih periode cepat...</option><option value="thisMonth">Bulan Ini</option><option value="lastMonth">Bulan Lalu</option><option value="thisYear">Tahun Ini</option></select></div><div class="field"><label>Dari</label><input type="date" value="${state.period.from}" onchange="state.period.from=this.value;renderPage()"></div><div class="field"><label>Sampai</label><input type="date" value="${state.period.to}" onchange="state.period.to=this.value;renderPage()"></div><button class="btn ghost" onclick="clearPeriod()">Semua Periode</button></div><div class="periodnote">Periode aktif: <strong>${periodLabel()}</strong>. Proyek dihitung jika periode aktivitasnya beririsan dengan rentang yang dipilih.</div></div><div class="cards section"><div class="card kpi"><div class="label">TOTAL PROYEK</div><div class="value">${a.length}</div></div><div class="card kpi"><div class="label">NILAI KONTRAK</div><div class="value">${money(sum('contract_value'))}</div></div><div class="card kpi"><div class="label">TOTAL RAP</div><div class="value">${money(sum('total_rap'))}</div></div><div class="card kpi"><div class="label">TOTAL REALISASI</div><div class="value">${money(sum('total_realization'))}</div></div><div class="card kpi"><div class="label">AVG PROGRESS</div><div class="value">${pct(avg)}</div></div></div><div class="section periodperf"><div class="sectiontitle"><h2>Kinerja Periode</h2><span class="note">Aktivitas yang benar-benar terjadi pada periode ${periodLabel()}</span></div><div class="cards"><div class="card kpi"><div class="label">CASH IN PERIODE</div><div class="value">${money(pp.cashIn)}</div></div><div class="card kpi"><div class="label">CASH OUT PERIODE</div><div class="value">${money(pp.cashOut)}</div></div><div class="card kpi"><div class="label">REALISASI PERIODE</div><div class="value">${money(pp.cashOut)}</div></div><div class="card kpi"><div class="label">NET CASHFLOW</div><div class="value">${money(pp.net)}</div></div><div class="card kpi"><div class="label">AVG TAMBAHAN PROGRESS</div><div class="value">${pct(pp.progressAverage)}</div></div></div><div class="card tablecard"><div class="scroll"><table class="table"><thead><tr><th>Proyek</th><th>Cash In</th><th>Cash Out</th><th>Net Cashflow</th><th>Tambahan Progress</th></tr></thead><tbody>${pp.rows.map(x=>`<tr><td><button class="linkbtn" onclick="openProject('${x.project_id}')">${esc(x.project_code)} — ${esc(x.project_name)}</button></td><td>${money(x.periodCashIn)}</td><td>${money(x.periodCashOut)}</td><td>${money(x.periodNet)}</td><td>${pct(x.periodProgress)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Tidak ada aktivitas pada periode yang dipilih.</td></tr>'}</tbody></table></div></div></div><div class="section"><div class="health"><div class="box green"><div class="big">${g}</div><div>SEHAT</div></div><div class="box amber"><div class="big">${w}</div><div>PERLU PENGAWASAN</div></div><div class="box red"><div class="big">${r}</div><div>BERISIKO</div></div></div></div><div class="section"><div class="sectiontitle"><h2>Project Health</h2><span class="note">${a.length} proyek pada periode aktif</span></div><div class="card tablecard"><div class="scroll"><table class="table"><thead><tr><th>Proyek</th><th>Progress</th><th>Cost Ratio</th><th>RAP Consumption</th><th>Status</th></tr></thead><tbody>${a.map(x=>`<tr><td><button class="linkbtn" onclick="openProject('${x.project_id}')">${esc(x.project_code)} — ${esc(x.project_name)}</button></td><td>${pct(x.project_progress)}</td><td>${pct(x.cost_ratio)}</td><td>${pct(x.rap_consumption)}</td><td><span class="pill ${healthClass(x.health_status)}">${esc(x.health_status)}</span></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Tidak ada proyek pada periode yang dipilih.</td></tr>'}</tbody></table></div></div></div></div>`}
function applyPreset'''
              s, count = pattern.subn(replacement, s, count=1)
              if count != 1: raise SystemExit('Dashboard function pattern not found')
              p.write_text(s, encoding='utf-8')

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
