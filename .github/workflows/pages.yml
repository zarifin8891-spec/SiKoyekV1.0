name: Deploy SiKoyek V1.0

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Expose authenticated client to presentation helpers
        shell: python
        run: |
          from pathlib import Path
          path=Path('index.html')
          html=path.read_text(encoding='utf-8')
          marker="const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});"
          if marker in html and 'window.__siKoyekSupabase=sb;' not in html:
            html=html.replace(marker, marker+'\nwindow.__siKoyekSupabase=sb;', 1)
          path.write_text(html,encoding='utf-8')
      - name: Add period performance module
        shell: python
        run: |
          from pathlib import Path
          import re
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          html = re.sub(r'<script src="\\./period-performance\\.js\\?v=\\d+"></script>', '', html)
          html = html.replace('</body>', '<script src="./period-performance.js?v=2"></script></body>', 1)
          path.write_text(html, encoding='utf-8')
      - name: Add dashboard graphs module
        shell: python
        run: |
          from pathlib import Path
          import re
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          for asset in ['dashboard-graphs.js','dashboard-graphs-ui-fix.js','detail-finance-kpi.js']:
            html = re.sub(r'<script src="\\./'+re.escape(asset)+r'\\?v=\\d+"></script>', '', html)
          html = html.replace('</body>', '<script src="./dashboard-graphs.js?v=6"></script><script src="./dashboard-graphs-ui-fix.js?v=1"></script><script src="./detail-finance-kpi.js?v=1"></script></body>', 1)
          path.write_text(html, encoding='utf-8')
      - name: Add cost control reconciliation module
        shell: python
        run: |
          from pathlib import Path
          import re
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          html = re.sub(r'<script src="\\./cost-control-audit\\.js\\?v=\\d+"></script>', '', html)
          html = html.replace('</body>', '<script src="./cost-control-audit.js?v=1"></script></body>', 1)
          path.write_text(html, encoding='utf-8')
      - name: Add RAP validation module
        shell: python
        run: |
          from pathlib import Path
          import re
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          html = re.sub(r'<script src="\\./rap-control-validation\\.js\\?v=\\d+"></script>', '', html)
          html = html.replace('</body>', '<script src="./rap-control-validation.js?v=1"></script></body>', 1)
          path.write_text(html, encoding='utf-8')
      - name: Add dashboard data fallback module
        shell: python
        run: |
          from pathlib import Path
          import re
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          html = re.sub(r'<script src="\\./dashboard-data-fallback-v1\\.js\\?v=\\d+"></script>', '', html)
          html = html.replace('</body>', '<script src="./dashboard-data-fallback-v1.js?v=1"></script></body>', 1)
          path.write_text(html, encoding='utf-8')
      - name: Add Health Engine Dashboard integration
        shell: python
        run: |
          from pathlib import Path
          import re
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          html = re.sub(r'<script src="\\./health-dashboard-integration-v1\\.js\\?v=\\d+"></script>', '', html)
          html = html.replace('</body>', '<script src="./health-dashboard-integration-v1.js?v=1"></script></body>', 1)
          path.write_text(html, encoding='utf-8')
      - name: Add Decision Engine Dashboard integration
        shell: python
        run: |
          from pathlib import Path
          import re
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          html = re.sub(r'<script src="\\./decision-dashboard-integration-v1\\.js\\?v=\\d+"></script>', '', html)
          html = html.replace('</body>', '<script src="./decision-dashboard-integration-v1.js?v=1"></script></body>', 1)
          path.write_text(html, encoding='utf-8')
      - name: Add UI/UX form modules through pass 8 stability
        shell: python
        run: |
          from pathlib import Path
          import re
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          assets_css=['ui-revamp-v1.css','ui-form-polish-v2.css','ui-form-fixes-v3.css','ui-form-pass5.css','ui-form-pass6.css','ui-form-step1.css','ui-form-pass7.css','ui-form-pass8.css','master-data-v1.css','ui-cleanup-v1.css','dashboard-layout-v2.css','dashboard-final-fix.css','dashboard-header-kpi-v1.css']
          assets_js=['ui-revamp-v1.js','ui-input-revamp-v1.js','ui-form-fixes-v3.js','ui-form-pass5.js','ui-form-pass6.js','ui-form-step1.js','ui-form-pass7.js','ui-form-pass8.js','dashboard-layout-v2.js','dashboard-header-fix-v2.js']
          for asset in assets_css:
            html=re.sub(r'<link rel="stylesheet" href="\\./'+re.escape(asset)+r'\\?v=\\d+">','',html)
          for asset in assets_js:
            html=re.sub(r'<script src="\\./'+re.escape(asset)+r'\\?v=\\d+"></script>','',html)
          html=html.replace('</head>','<link rel="stylesheet" href="./ui-revamp-v1.css?v=1"><link rel="stylesheet" href="./ui-form-polish-v2.css?v=2"><link rel="stylesheet" href="./ui-form-fixes-v3.css?v=3"><link rel="stylesheet" href="./ui-form-pass5.css?v=2"><link rel="stylesheet" href="./ui-form-pass6.css?v=2"><link rel="stylesheet" href="./ui-form-step1.css?v=2"><link rel="stylesheet" href="./ui-form-pass7.css?v=1"><link rel="stylesheet" href="./ui-form-pass8.css?v=1"><link rel="stylesheet" href="./master-data-v1.css?v=1"><link rel="stylesheet" href="./ui-cleanup-v1.css?v=1"><link rel="stylesheet" href="./dashboard-layout-v2.css?v=4"><link rel="stylesheet" href="./dashboard-final-fix.css?v=4"><link rel="stylesheet" href="./dashboard-header-kpi-v1.css?v=2"></head>',1)
          html=html.replace('</body>','<script src="./ui-revamp-v1.js?v=1"></script><script src="./ui-input-revamp-v1.js?v=2"></script><script src="./ui-form-fixes-v3.js?v=3"></script><script src="./ui-form-pass5.js?v=2"></script><script src="./ui-form-pass6.js?v=2"></script><script src="./ui-form-step1.js?v=2"></script><script src="./ui-form-pass7.js?v=1"></script><script src="./ui-form-pass8.js?v=1"></script><script src="./master-data-v1.js?v=1"></script><script src="./dashboard-layout-v2.js?v=4"></script><script src="./dashboard-header-fix-v2.js?v=1"></script></body>',1)
          path.write_text(html,encoding='utf-8')
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
