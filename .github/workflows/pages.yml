name: Deploy SiKoyek V1.0

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply final login visual override
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<link rel="stylesheet" href="login-style\.css\?v=\d+">', '', s)
          override = r'''
<style id="login-final-override">
.login{min-height:100vh!important;display:grid!important;place-items:center!important;padding:20px!important;background:linear-gradient(135deg,#f4f7fb 0%,#edf2f7 100%)!important}
.login .loginbox{width:min(410px,calc(100vw - 40px))!important;background:#fff!important;border:1px solid #dfe5ed!important;border-radius:18px!important;padding:28px 30px 24px!important;box-shadow:0 18px 44px rgba(23,32,51,.09)!important;overflow:hidden!important;position:relative!important}
.login .loginbox::before{content:""!important;display:block!important;height:5px!important;margin:-28px -30px 22px!important;background:#294a80!important}
.login .brand{margin:0!important;padding:0!important;background:transparent!important;color:#172033!important;text-align:left!important;font-size:31px!important;line-height:1.1!important;font-weight:800!important}
.login .brand b{color:#245cff!important;font-weight:800!important}
.login .loginbox h2{margin:5px 0 22px!important;padding:0!important;background:transparent!important;color:#5a677b!important;text-align:left!important;font-size:16px!important;line-height:1.3!important;font-weight:650!important;border-radius:0!important}
.login .loginbox .field{margin:15px 0!important}
.login .loginbox .field label{display:block!important;font-size:13px!important;font-weight:800!important;color:#25324a!important;letter-spacing:.01em!important;margin-bottom:7px!important;text-transform:none!important}
.login .loginbox .field input,.login .loginbox .field select,.login .loginbox .field textarea{width:100%!important;height:48px!important;padding:11px 13px!important;border:1px solid #cfd7e2!important;border-radius:11px!important;background:#fff!important;color:#172033!important;font-size:16px!important;box-shadow:none!important}
.login .loginbox .field input:focus{outline:none!important;border-color:#829ef2!important;box-shadow:0 0 0 3px rgba(36,92,255,.10)!important}
.login .loginbox .password-wrap input{padding-right:48px!important}
.login .loginbox .toggle-password{position:absolute!important;right:0!important;top:0!important;width:46px!important;height:48px!important;border:0!important;background:transparent!important;color:#71809a!important;display:grid!important;place-items:center!important;cursor:pointer!important;padding:0!important}
.login .loginbox .toggle-password svg{width:21px!important;height:21px!important}
.login .loginbox #loginBtn{width:100%!important;height:49px!important;margin-top:7px!important;background:#167967!important;color:#fff!important;border:0!important;border-radius:11px!important;font-size:17px!important;font-weight:800!important;box-shadow:0 8px 18px rgba(22,121,103,.14)!important}
.login .loginbox #loginBtn:hover{background:#146f61!important}
.login .loginbox .forgot-wrap{text-align:center!important;margin-top:17px!important}
.login .loginbox .forgot-link{border:0!important;background:transparent!important;color:#167967!important;font-size:14px!important;font-weight:750!important;padding:0!important}
.login .loginbox .err{margin-top:10px!important;font-size:13px!important}
@media(max-width:520px){
  .login{padding:12px!important}
  .login .loginbox{width:min(410px,calc(100vw - 24px))!important;padding:24px 20px 22px!important;border-radius:16px!important}
  .login .loginbox::before{margin:-24px -20px 20px!important}
  .login .brand{font-size:28px!important}
  .login .loginbox h2{font-size:15px!important;margin-bottom:18px!important}
  .login .loginbox .field input{height:46px!important;font-size:16px!important}
  .login .loginbox .toggle-password{height:46px!important}
  .login .loginbox #loginBtn{height:47px!important;font-size:16px!important}
}
</style>
'''
          s = re.sub(r'</head>', override + '</head>', s, count=1)
          p.write_text(s, encoding='utf-8')

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
