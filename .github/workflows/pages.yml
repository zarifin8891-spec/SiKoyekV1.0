name: Deploy SiKoyek V1.0

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add period performance module
        shell: python
        run: |
          from pathlib import Path
          import re
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          html = re.sub(r'<script src="\\./period-performance\\.js\\?v=\\d+"></script>', '', html)
          html = html.replace('</body>', '<script src="./period-performance.js?v=2"></script></body>', 1)
          path.write_text(html, encoding='utf-8')

      - name: Add dashboard graphs module
        shell: python
        run: |
          from pathlib import Path
          import re
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          html = re.sub(r'<script src="\\./dashboard-graphs\\.js\\?v=\\d+"></script>', '', html)
          html = html.replace('</body>', '<script src="./dashboard-graphs.js?v=5"></script></body>', 1)
          path.write_text(html, encoding='utf-8')

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
