name: Patch Dashboard Lower Panels

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch index.html dashboard panels
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s

          # Keep the approved dashboard header/KPI implementation untouched.
          s = s.replace('>PERLU PENGAWASAN</div></div><div class="dashboard-status red">', '>AWASI</div></div><div class="dashboard-status red">')
          s = s.replace('<h2>Project Health</h2><span class="note">Progress vs Cost Ratio &amp; RAP Consumption</span>', '<h2>Kondisi Proyek</h2><span class="note">Progress vs Rasio Biaya &amp; RAP Terpakai</span>')
          s = s.replace('<h2>Kesehatan Proyek</h2><span class="note">Progress vs Rasio Biaya &amp; RAP Terpakai</span>', '<h2>Kondisi Proyek</h2><span class="note">Progress vs Rasio Biaya &amp; RAP Terpakai</span>')
          s = s.replace('<span class="note">Rekomendasi berbasis Project Health</span>', '<span class="note">Rekomendasi berbasis Kondisi Proyek</span>')
          s = s.replace('<span class="note">Rekomendasi berbasis Kesehatan Proyek</span>', '<span class="note">Rekomendasi berbasis Kondisi Proyek</span>')

          css = '''
/* SiKoyek V1.0 — final equal-height lower dashboard panels */
.dashboard-panels{grid-template-columns:minmax(0,44fr) minmax(0,56fr)!important;gap:14px!important;align-items:stretch!important}
.dashboard-panel{min-width:0!important;align-self:stretch!important;height:auto!important;min-height:0!important;display:flex!important;flex-direction:column!important}
.dashboard-panel .sectiontitle{flex:0 0 auto!important}
.dashboard-panel .tablecard{height:auto!important;min-height:0!important;max-height:none!important;flex:1 1 auto!important}
.dashboard-panel .scroll{height:auto!important;max-height:none!important;overflow:hidden!important}
.dashboard-panel .table{width:100%!important;table-layout:fixed!important}
.dashboard-panel .table th,.dashboard-panel .table td{padding:4px 9px!important;font-size:11px!important;line-height:1.12!important;vertical-align:middle!important}
.dashboard-panel .table th{font-size:9px!important;white-space:normal!important;line-height:1.05!important}
.dashboard-panel .table tbody tr:nth-child(odd){background:#ffffff!important}
.dashboard-panel .table tbody tr:nth-child(even){background:#eef4f9!important}
.dashboard-panel .table tbody tr td{border-bottom:1px solid #dfe7ef!important}
.dashboard-panel .table tbody tr:last-child td{border-bottom:0!important}
.dashboard-panel .table tbody tr:hover{background:#e7eef5!important}
.dashboard-panel:first-child .table th:nth-child(1),.dashboard-panel:first-child .table td:nth-child(1){width:41%!important}
.dashboard-panel:first-child .table th:nth-child(2),.dashboard-panel:first-child .table td:nth-child(2){width:12%!important}
.dashboard-panel:first-child .table th:nth-child(3),.dashboard-panel:first-child .table td:nth-child(3){width:14%!important}
.dashboard-panel:first-child .table th:nth-child(4),.dashboard-panel:first-child .table td:nth-child(4){width:18%!important}
.dashboard-panel:first-child .table th:nth-child(5),.dashboard-panel:first-child .table td:nth-child(5){width:15%!important}
.dashboard-panel:first-child .table td:first-child{white-space:normal!important}
.dashboard-panel:last-child .table th:nth-child(1),.dashboard-panel:last-child .table td:nth-child(1){width:32%!important}
.dashboard-panel:last-child .table th:nth-child(2),.dashboard-panel:last-child .table td:nth-child(2){width:12%!important}
.dashboard-panel:last-child .table th:nth-child(3),.dashboard-panel:last-child .table td:nth-child(3){width:11%!important}
.dashboard-panel:last-child .table th:nth-child(4),.dashboard-panel:last-child .table td:nth-child(4){width:22%!important;white-space:normal!important}
.dashboard-panel:last-child .table th:nth-child(5),.dashboard-panel:last-child .table td:nth-child(5){width:23%!important;white-space:normal!important}
.dashboard-panel:last-child .table td:first-child{white-space:normal!important}
@media(max-width:1100px){.dashboard-panels{grid-template-columns:1fr!important}}
'''

          marker = '/* SiKoyek V1.0 — final equal-height lower dashboard panels */'
          if marker not in s:
              s = s.replace('</style>', '\n' + css + '</style>', 1)
          else:
              print('Final equal-height CSS already present.')

          if s == original:
              print('No changes required.')
          else:
              p.write_text(s, encoding='utf-8')
              print('Dashboard final equal-height patch applied.')

      - name: Commit patched dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "fix equal height dashboard lower panels"
            git push
          fi
