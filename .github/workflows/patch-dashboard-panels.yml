name: Patch Dashboard Lower Panels

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch index.html dashboard panels
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s

          # Keep the already-approved header/KPI implementation untouched.
          s = s.replace('>PERLU PENGAWASAN</div></div><div class="dashboard-status red">', '>AWASI</div></div><div class="dashboard-status red">')
          s = s.replace('<h2>Project Health</h2><span class="note">Progress vs Cost Ratio &amp; RAP Consumption</span>', '<h2>Kondisi Proyek</h2><span class="note">Progress vs Rasio Biaya &amp; RAP Terpakai</span>')
          s = s.replace('<h2>Kesehatan Proyek</h2><span class="note">Progress vs Rasio Biaya &amp; RAP Terpakai</span>', '<h2>Kondisi Proyek</h2><span class="note">Progress vs Rasio Biaya &amp; RAP Terpakai</span>')
          s = s.replace('<th>Proyek</th><th>Progress</th><th>Cost Ratio</th><th>RAP<br>Consumption</th><th>Health</th><th>Gap Cost</th>', '<th>Proyek</th><th>Progress</th><th>Rasio<br>Biaya</th><th>RAP<br>Terpakai</th><th>Status</th>')
          s = s.replace('<td><span class="pill ${healthClass(x.health_status)}">${esc(x.health_status)}</span></td><td>${Number(x.cost_ratio||0)-Number(x.rap_consumption||0>=0)?\'\':\'\'}${pct(Number(x.cost_ratio||0)-Number(x.rap_consumption||0))}</td>', '<td><span class="pill ${healthClass(x.health_status)}">${esc(x.health_status)}</span></td>')
          s = s.replace('<span class="note">Rekomendasi berbasis Project Health</span>', '<span class="note">Rekomendasi berbasis Kondisi Proyek</span>')
          s = s.replace('<span class="note">Rekomendasi berbasis Kesehatan Proyek</span>', '<span class="note">Rekomendasi berbasis Kondisi Proyek</span>')
          s = s.replace('<th>Proyek</th><th>Prioritas</th><th>Status</th><th>Masalah Utama</th><th>Tindakan</th>', '<th>Proyek</th><th>Prioritas</th><th>Status</th><th>Masalah<br>Utama</th><th>Tindakan</th>')

          css = '''\n/* SiKoyek V1.0 — approved lower dashboard panel layout */\n.dashboard-panels{grid-template-columns:minmax(0,44fr) minmax(0,56fr)!important;gap:14px!important;align-items:start!important}\n.dashboard-panel{min-width:0!important;align-self:start!important;height:auto!important;min-height:0!important}\n.dashboard-panel .tablecard{height:auto!important;min-height:0!important;max-height:none!important;flex:none!important}\n.dashboard-panel .scroll{height:auto!important;max-height:none!important;overflow:hidden!important}\n.dashboard-panel .table{width:100%!important;table-layout:fixed!important}\n.dashboard-panel .table th,.dashboard-panel .table td{padding:4px 9px!important;font-size:11px!important;line-height:1.12!important;vertical-align:middle!important}\n.dashboard-panel .table th{font-size:9px!important;white-space:normal!important;line-height:1.05!important}\n.dashboard-panel .table tbody tr:nth-child(odd){background:#ffffff!important}\n.dashboard-panel .table tbody tr:nth-child(even){background:#eef4f9!important}\n.dashboard-panel .table tbody tr td{border-bottom:1px solid #dfe7ef!important}\n.dashboard-panel .table tbody tr:last-child td{border-bottom:0!important}\n.dashboard-panel .table tbody tr:hover{background:#e7eef5!important}\n.dashboard-panel:first-child .table th:nth-child(1),.dashboard-panel:first-child .table td:nth-child(1){width:41%!important}\n.dashboard-panel:first-child .table th:nth-child(2),.dashboard-panel:first-child .table td:nth-child(2){width:12%!important}\n.dashboard-panel:first-child .table th:nth-child(3),.dashboard-panel:first-child .table td:nth-child(3){width:14%!important}\n.dashboard-panel:first-child .table th:nth-child(4),.dashboard-panel:first-child .table td:nth-child(4){width:18%!important}\n.dashboard-panel:first-child .table th:nth-child(5),.dashboard-panel:first-child .table td:nth-child(5){width:15%!important}\n.dashboard-panel:first-child .table td:first-child{white-space:normal!important}\n.dashboard-panel:last-child .table th:nth-child(1),.dashboard-panel:last-child .table td:nth-child(1){width:32%!important}\n.dashboard-panel:last-child .table th:nth-child(2),.dashboard-panel:last-child .table td:nth-child(2){width:12%!important}\n.dashboard-panel:last-child .table th:nth-child(3),.dashboard-panel:last-child .table td:nth-child(3){width:11%!important}\n.dashboard-panel:last-child .table th:nth-child(4),.dashboard-panel:last-child .table td:nth-child(4){width:22%!important;white-space:normal!important}\n.dashboard-panel:last-child .table th:nth-child(5),.dashboard-panel:last-child .table td:nth-child(5){width:23%!important;white-space:normal!important}\n.dashboard-panel:last-child .table td:first-child{white-space:normal!important}\n@media(max-width:1100px){.dashboard-panels{grid-template-columns:1fr!important}}\n'''
          marker = '/* SiKoyek V1.0 — compact lower panel height + zebra rows */'
          if marker not in s:
              s = s.replace('</style>', '\n' + marker + css + '</style>', 1)

          if s == original:
              print('No changes required.')
          else:
              p.write_text(s, encoding='utf-8')
              print('Dashboard lower panel patch applied.')

      - name: Commit patched dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "fix compact dashboard rows and panel height"
            git push
          fi
