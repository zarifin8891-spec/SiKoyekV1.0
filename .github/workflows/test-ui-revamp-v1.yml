name: Test UI Revamp V1

on:
  push:
    branches:
      - feature/ui-form-fixes-v3
      - feature/ui-form-pass4
      - feature/ui-form-pass5
      - feature/cleanup-duplicate-project-health
  pull_request:
    branches:
      - main

jobs:
  test-ui-revamp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check UI modules
        run: |
          node --check ui-revamp-v1.js
          node --check ui-input-revamp-v1.js
          node --check ui-form-fixes-v3.js
          node --check ui-form-pass5.js
      - name: Verify UI assets exist
        run: |
          test -s ui-revamp-v1.css
          test -s ui-revamp-v1.js
          test -s ui-form-fixes-v3.css
          test -s ui-form-fixes-v3.js
          test -s ui-form-pass5.css
          test -s ui-form-pass5.js
      - name: Run form fix integration test
        run: node tests/ui-form-fixes-v3.test.js
      - name: Run UI revamp integration test
        run: node tests/ui-revamp-v1.test.js
      - name: Run UI form pass 5 integration test
        run: node tests/ui-form-pass5.test.js
      - name: Verify deployment includes form assets
        run: |
          grep -q 'ui-form-fixes-v3.js?v=3' .github/workflows/pages.yml
          grep -q 'ui-form-fixes-v3.css?v=3' .github/workflows/pages.yml
          grep -q 'ui-form-pass5.js?v=1' .github/workflows/pages.yml
          grep -q 'ui-form-pass5.css?v=1' .github/workflows/pages.yml
      - name: Verify category master migration
        run: |
          test -s supabase/migrations/20260825045000_project_category_master.sql
          grep -q 'project_categories' supabase/migrations/20260825045000_project_category_master.sql
