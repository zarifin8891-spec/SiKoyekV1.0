name: Fix SiKoyek login handler

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-login:
    if: !contains(github.event.head_commit.message, 'fix: robust login handler')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch login function
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''async function login(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const {error}=await sb.auth.signInWithPassword({email,password});if(error)document.getElementById('loginErr').textContent=error.message}'''
          new = '''async function login(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,btn=document.querySelector('.loginbox .full'),err=document.getElementById('loginErr');if(!email||!password){err.textContent='Email dan password wajib diisi.';return}btn.disabled=true;btn.textContent='Memproses...';err.textContent='';try{const {error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;await loadSummary();renderApp()}catch(e){err.textContent=e?.message||'Login gagal.';btn.disabled=false;btn.textContent='Masuk'}}'''
          if old not in s:
              raise SystemExit('Target login function not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

      - name: Commit fix and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-login.yml
          git commit -m "fix: robust login handler"
          git rm .github/workflows/fix-login.yml
          git commit -m "chore: remove one-shot login patch workflow"
          git push
