name: Test SiKoyek company database

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  company-database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: sikoyek_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sikoyek_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test-only
      PGDATABASE: sikoyek_test
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated Auth fixtures
        run: |
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          create role anon;
          create role authenticated;
          create role service_role bypassrls;
          create schema auth;
          create table auth.users (id uuid primary key, email text unique not null);
          create function auth.uid() returns uuid language sql stable as
            $$ select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          grant usage on schema auth to authenticated;
          grant execute on function auth.uid() to authenticated;
          SQL
      - name: Apply company migrations in order
        run: |
          for migration in supabase/migrations/*_company_*.sql supabase/migrations/*_staff_access_settings.sql supabase/migrations/*_platform_account_maintenance.sql; do
            printf '%s\n' "$migration"
          done | sort | while IFS= read -r migration; do
            printf 'Applying %s\n' "$migration"
            psql -X -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Test role permissions, isolation and resource overlap
        run: |
          for scenario in tests/multi-perusahaan/company-*.sql; do
            printf 'Testing %s\n' "$scenario"
            psql -X -v ON_ERROR_STOP=1 -f "$scenario"
          done
