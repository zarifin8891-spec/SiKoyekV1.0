name: Deploy SiKoyek Unified Pages

on:
  workflow_run:
    workflows: ["Deploy SiKoyek V1.0"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-unified
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download successful Master Pages artifact
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: _pages_artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout repository for manual deployment
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v4

      - name: Extract Master Pages artifact
        if: ${{ github.event_name == 'workflow_run' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _master
          shopt -s nullglob
          files=( _pages_artifact/* )
          test "${#files[@]}" -gt 0
          found=0
          for f in "${files[@]}"; do
            case "$f" in
              *.tar.gz|*.tgz) tar -xzf "$f" -C _master; found=1 ;;
              *.tar) tar -xf "$f" -C _master; found=1 ;;
            esac
          done
          test "$found" -eq 1
          test -f _master/index.html
          echo "Master Pages artifact extracted."

      - name: Prepare source tree
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            cp -a _master _source
          else
            mkdir -p _source
            cp -a . _source/repository
            shopt -s dotglob
            rm -rf _source/repository/.git _source/repository/.github
            cp -a _source/repository/. _source/
            rm -rf _source/repository
          fi
          test -f _source/index.html

      - name: Build Master and Konstruva site trees
        shell: python
        run: |
          from pathlib import Path
          import shutil

          source = Path('_source')
          site = Path('_site')
          master = site / 'Master'
          konstruva = site / 'konstruva'

          if site.exists():
              shutil.rmtree(site)
          master.mkdir(parents=True)
          konstruva.mkdir(parents=True)

          def copy_tree(destination):
              for item in source.iterdir():
                  target = destination / item.name
                  if item.is_dir():
                      shutil.copytree(item, target)
                  else:
                      shutil.copy2(item, target)

          copy_tree(master)
          copy_tree(konstruva)

          master_url = 'https://mmkusplegmittrlxqxby.supabase.co'
          master_key = 'sb_publishable_m9qLt2yxWi6i40bo9ixR5A_QIbOLoyf'
          konstruva_url = 'https://fadxsycdgzuctvmhhjty.supabase.co'
          konstruva_key = 'sb_publishable_kdVGUzaKxMNFiJLpaGgSTQ_KP8IDJ2o'

          html = (konstruva / 'index.html').read_text(encoding='utf-8')
          if master_url not in html or master_key not in html:
              raise SystemExit('Konstruva source does not contain the expected MASTER Supabase configuration.')
          html = html.replace(master_url, konstruva_url).replace(master_key, konstruva_key)
          (konstruva / 'index.html').write_text(html, encoding='utf-8')

          save_fix = r'''<script id="sikoyek-master-data-save-fix-v2">
          window.siKoyekSaveMaster = async function(table, title){
            const name = document.getElementById('md_name')?.value.trim();
            const sort = Number(document.getElementById('md_sort')?.value || 0);
            if(!name){ toast('Nama wajib diisi'); return; }
            const {error} = await window.sb.from(table).insert({name, sort_order:sort, is_active:true});
            if(error){ toast(error.message); return; }
            closeModal();
            toast(title + ' ditambahkan');
            if(typeof window.openMasterData === 'function') window.openMasterData();
          };
          </script>'''

          for app in (master, konstruva):
              p = app / 'index.html'
              h = p.read_text(encoding='utf-8')
              h = h.replace("onclick=\"add('transaction_categories','Kategori Keuangan')\"", "onclick=\"window.siKoyekSaveMaster('transaction_categories','Kategori Keuangan')\"")
              h = h.replace("onclick=\"add('payment_methods','Metode Pembayaran')\"", "onclick=\"window.siKoyekSaveMaster('payment_methods','Metode Pembayaran')\"")
              if 'sikoyek-master-data-save-fix-v2' not in h:
                  h = h.replace('</body>', save_fix + '</body>')
              p.write_text(h, encoding='utf-8')

          launcher = '''<!doctype html>
          <html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SiKoyek V1.0</title>
          <style>body{font-family:Arial,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f7fb;color:#17304f}main{background:#fff;padding:36px 42px;border-radius:18px;box-shadow:0 12px 40px rgba(20,50,90,.12);text-align:center;max-width:520px;width:calc(100% - 40px);box-sizing:border-box}h1{margin:0 0 8px;font-size:28px}p{margin:0 0 24px;color:#617089}a{display:block;margin:10px 0;padding:13px 16px;border-radius:10px;background:#173b67;color:#fff;text-decoration:none;font-weight:700}</style></head>
          <body><main><h1>SiKoyek V1.0</h1><p>Pilih lingkungan aplikasi:</p><a href="./Master/">SiKoyek MASTER</a><a href="./konstruva/">SiKoyek KONSTRUVА</a></main></body></html>'''
          (site / 'index.html').write_text(launcher, encoding='utf-8')

      - name: Verify unified site
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/Master/index.html
          test -f _site/konstruva/index.html
          grep -F "https://mmkusplegmittrlxqxby.supabase.co" _site/Master/index.html
          grep -F "sb_publishable_m9qLt2yxWi6i40bo9ixR5A_QIbOLoyf" _site/Master/index.html
          grep -F "https://fadxsycdgzuctvmhhjty.supabase.co" _site/konstruva/index.html
          grep -F "sb_publishable_kdVGUzaKxMNFiJLpaGgSTQ_KP8IDJ2o" _site/konstruva/index.html
          grep -F "sikoyek-master-data-save-fix-v2" _site/Master/index.html
          grep -F "sikoyek-master-data-save-fix-v2" _site/konstruva/index.html
          if grep -F "https://mmkusplegmittrlxqxby.supabase.co" _site/konstruva/index.html; then exit 1; fi
          if grep -F "sb_publishable_m9qLt2yxWi6i40bo9ixR5A_QIbOLoyf" _site/konstruva/index.html; then exit 1; fi
          echo "Unified Master/Konstruva site verified."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload unified Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy unified Pages site
        id: deployment
        uses: actions/deploy-pages@v4
