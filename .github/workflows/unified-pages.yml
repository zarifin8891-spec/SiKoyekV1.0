name: Deploy SiKoyek Unified Pages

on:
  workflow_run:
    workflows: ["Deploy SiKoyek V1.0"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-unified
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the successful Master Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: _pages_artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _master
          shopt -s nullglob
          files=( _pages_artifact/* )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Pages artifact is empty."
            exit 1
          fi
          found=0
          for f in "${files[@]}"; do
            case "$f" in
              *.tar.gz|*.tgz)
                tar -xzf "$f" -C _master
                found=1
                ;;
              *.tar)
                tar -xf "$f" -C _master
                found=1
                ;;
            esac
          done
          if [ "$found" -ne 1 ]; then
            echo "Could not find the packaged Pages tar archive."
            find _pages_artifact -maxdepth 2 -type f -print
            exit 1
          fi
          test -f _master/index.html
          echo "Master Pages artifact extracted successfully."

      - name: Build /Master and /konstruva site trees
        shell: python
        run: |
          from pathlib import Path
          import shutil
          import re

          source = Path('_master')
          site = Path('_site')
          master = site / 'Master'
          konstruva = site / 'konstruva'

          if site.exists():
              shutil.rmtree(site)
          master.mkdir(parents=True)
          konstruva.mkdir(parents=True)

          def copy_tree(destination: Path):
              for item in source.iterdir():
                  target = destination / item.name
                  if item.is_dir():
                      shutil.copytree(item, target)
                  else:
                      shutil.copy2(item, target)

          copy_tree(master)
          copy_tree(konstruva)

          konstruva_html = (konstruva / 'index.html').read_text(encoding='utf-8')

          master_url = 'https://mmkusplegmittrlxqxby.supabase.co'
          master_key_marker = 'sb_publishable_'
          konstruva_url = 'https://fadxsycdgzuctvmhhjty.supabase.co'
          konstruva_key = 'sb_publishable_kdVGUzaKxMNFiJLpaGgSTQ_KP8IDJ2o'

          if master_url not in konstruva_html:
              raise SystemExit('Konstruva build does not contain the expected MASTER Supabase URL before transformation.')
          if master_key_marker not in konstruva_html:
              raise SystemExit('Konstruva build does not contain a publishable Supabase key before transformation.')

          konstruva_html = konstruva_html.replace(master_url, konstruva_url)
          konstruva_html, replacements = re.subn(
              r"sb_publishable_[A-Za-z0-9_-]+",
              konstruva_key,
              konstruva_html,
              count=1,
          )
          if replacements != 1:
              raise SystemExit(f'Expected exactly one Supabase publishable key replacement, got {replacements}.')
          (konstruva / 'index.html').write_text(konstruva_html, encoding='utf-8')

          launcher = '''<!doctype html>
          <html lang="id">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>SiKoyek V1.0</title>
            <style>
              body{font-family:Arial,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f7fb;color:#17304f}
              main{background:#fff;padding:36px 42px;border-radius:18px;box-shadow:0 12px 40px rgba(20,50,90,.12);text-align:center;max-width:520px;width:calc(100% - 40px);box-sizing:border-box}
              h1{margin:0 0 8px;font-size:28px}
              p{margin:0 0 24px;color:#617089}
              a{display:block;margin:10px 0;padding:13px 16px;border-radius:10px;background:#173b67;color:#fff;text-decoration:none;font-weight:700}
            </style>
          </head>
          <body>
            <main>
              <h1>SiKoyek V1.0</h1>
              <p>Pilih lingkungan aplikasi:</p>
              <a href="./Master/">SiKoyek MASTER</a>
              <a href="./konstruva/">SiKoyek KONSTRUVА</a>
            </main>
          </body>
          </html>
          '''
          (site / 'index.html').write_text(launcher, encoding='utf-8')

          print('Created:', master, konstruva)

      - name: Verify Master and Konstruva separation
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/Master/index.html
          test -f _site/konstruva/index.html

          grep -F "https://mmkusplegmittrlxqxby.supabase.co" _site/Master/index.html
          grep -F "sb_publishable_m9qLt2yxWi6i40bo9ixR5A_QIbOLoyf" _site/Master/index.html

          grep -F "https://fadxsycdgzuctvmhhjty.supabase.co" _site/konstruva/index.html
          grep -F "sb_publishable_kdVGUzaKxMNFiJLpaGgSTQ_KP8IDJ2o" _site/konstruva/index.html

          if grep -F "https://mmkusplegmittrlxqxby.supabase.co" _site/konstruva/index.html; then
            echo "ERROR: Konstruva still points to MASTER Supabase URL."
            exit 1
          fi
          if grep -F "sb_publishable_m9qLt2yxWi6i40bo9ixR5A_QIbOLoyf" _site/konstruva/index.html; then
            echo "ERROR: Konstruva still contains the MASTER publishable key."
            exit 1
          fi

          echo "Master and Konstruva frontend configurations are separated."

      - name: Verify relative local assets
        shell: python
        run: |
          from pathlib import Path
          import re

          for file in (Path('_site/Master/index.html'), Path('_site/konstruva/index.html')):
              html = file.read_text(encoding='utf-8')
              bad = re.findall(r'(?:src|href)=["\']/(?!/)[^"\']+', html, flags=re.I)
              if bad:
                  print(f'Potential root-absolute local asset references in {file}:')
                  for item in bad[:20]:
                      print(item)
                  raise SystemExit(1)
          print('No root-absolute local asset references detected in the two app entry points.')

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload unified Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy unified Pages site
        id: deployment
        uses: actions/deploy-pages@v4
