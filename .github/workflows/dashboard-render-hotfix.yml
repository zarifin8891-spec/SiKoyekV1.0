name: Dashboard Render Hotfix

on:
  workflow_run:
    workflows: ["Deploy SiKoyek V1.0"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  hotfix:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout deployed source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Remove duplicate Status from actual Dashboard HTML renderer
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          marker = '<h2>Prioritas &amp; Tindakan</h2>'
          pos = html.find(marker)
          if pos < 0:
              marker = '<h2>Prioritas & Tindakan</h2>'
              pos = html.find(marker)
          if pos < 0:
              raise SystemExit('Prioritas & Tindakan renderer not found')

          table_start = html.find('<table', pos)
          table_end = html.find('</table>', table_start)
          if table_start < 0 or table_end < 0:
              raise SystemExit('Decision table not found')
          table_end += len('</table>')
          table = html[table_start:table_end]

          row_re = re.compile(r'<tr\b[^>]*>.*?</tr>', re.S)
          cell_re = re.compile(r'<t[hd]\b[^>]*>.*?</t[hd]>', re.S)
          rows = list(row_re.finditer(table))
          if not rows:
              raise SystemExit('No table rows found in decision renderer')

          pieces = []
          last = 0
          changed = 0
          for row in rows:
              raw = row.group(0)
              cells = list(cell_re.finditer(raw))
              replacement = raw
              # Some rows are layout/empty rows with one cell. Leave those intact.
              # Only a real 5-column decision row is modified.
              if len(cells) == 5:
                  replacement = raw[:cells[2].start()] + raw[cells[2].end():]
                  changed += 1
              elif len(cells) not in (1, 4):
                  raise SystemExit(f'Unexpected decision row cell count: {len(cells)}')
              pieces.append(table[last:row.start()])
              pieces.append(replacement)
              last = row.end()
          pieces.append(table[last:])
          table = ''.join(pieces)

          if changed == 0:
              raise SystemExit('No 5-column decision rows found to hotfix')

          html = html[:table_start] + table + html[table_end:]
          path.write_text(html, encoding='utf-8')

      - name: Verify renderer has no duplicate Status column
        shell: python
        run: |
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          marker = '<h2>Prioritas &amp; Tindakan</h2>'
          pos = html.find(marker)
          if pos < 0:
              marker = '<h2>Prioritas & Tindakan</h2>'
              pos = html.find(marker)
          if pos < 0:
              raise SystemExit('Prioritas & Tindakan renderer not found')

          table_start = html.find('<table', pos)
          table_end = html.find('</table>', table_start)
          if table_start < 0 or table_end < 0:
              raise SystemExit('Decision table not found')
          table = html[table_start:table_end]

          if re.search(r'<th\b[^>]*>\s*Status\s*</th>', table, re.I):
              raise SystemExit('Status header still present in decision table')

          rows = list(re.finditer(r'<tr\b[^>]*>.*?</tr>', table, re.S))
          data_rows = []
          cell_re = re.compile(r'<t[hd]\b[^>]*>.*?</t[hd]>', re.S)
          for row in rows:
              count = len(cell_re.findall(row.group(0)))
              if count == 4:
                  data_rows.append(count)
              elif count == 1:
                  continue
              else:
                  raise SystemExit(f'Unexpected final decision row cell count: {count}')

          if not data_rows:
              raise SystemExit('No four-column decision rows found after hotfix')

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload hotfixed site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy hotfixed site
        id: deployment
        uses: actions/deploy-pages@v4
