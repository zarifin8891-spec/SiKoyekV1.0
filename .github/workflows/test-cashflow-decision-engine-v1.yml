name: Test Cash Flow Decision Engine V1.0

on:
  push:
    branches:
      - feature/cashflow-decision-engine-v1
  pull_request:
    branches:
      - main

jobs:
  test-cashflow-decision-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run core tests
        run: node tests/project-cashflow-decision-engine-v1.test.js
      - name: Run stress tests
        run: node tests/cashflow-decision-engine-stress-v1.test.js
      - name: Run Dashboard smoke test
        run: node tests/cashflow-dashboard-smoke-v1.js
