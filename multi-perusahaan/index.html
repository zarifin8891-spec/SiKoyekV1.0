<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SiKoyek Multi-Perusahaan</title>
  <link rel="stylesheet" href="../foundation/tokens.css">
  <link rel="stylesheet" href="./workspace.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="./environment.js"></script>
  <script defer src="../foundation/config.js"></script>
  <script defer src="../foundation/backend.js"></script>
  <script defer src="../foundation/runtime.js"></script>
  <script defer src="./operations.js"></script>
  <script defer src="./staff-access.js"></script>
  <script defer src="./workspace.js"></script>
</head>
<body>
  <main id="workspace">
    <header>
      <img src="../sikoyek-sidebar-logo.webp" width="160" height="56" alt="SiKoyek">
      <button type="button" id="logout" hidden>Keluar</button>
    </header>
    <p id="notice" role="status"></p>
    <section id="login" hidden>
      <h1>Masuk</h1>
      <form id="login-form">
        <label>Email<input name="email" type="email" required autocomplete="username"></label>
        <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
        <button type="submit">Masuk</button>
      </form>
    </section>
    <div id="signed-in" hidden>
      <h1 id="workspace-title"></h1>
      <p id="account-name"></p>
      <section id="company-panel" hidden>
        <h2>Data Perusahaan</h2>
        <form id="company-form">
          <label>Nama perusahaan<input name="name" maxlength="160" required></label>
          <button type="submit">Tambah Perusahaan</button>
        </form>
        <div class="table-scroll">
          <table><thead><tr><th>Perusahaan</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="companies"></tbody></table>
        </div>
      </section>
      <section id="account-panel" hidden>
        <h2 id="account-heading"></h2>
        <form id="account-form">
          <label id="company-field">Perusahaan<select name="company_id"></select></label>
          <label>Nama lengkap<input name="full_name" maxlength="160" required autocomplete="off"></label>
          <label>Email<input name="email" type="email" required autocomplete="off"></label>
          <label>Password awal<input name="password" type="password" required minlength="8" autocomplete="new-password"></label>
          <button type="submit" id="account-submit"></button>
        </form>
        <div class="table-scroll">
          <table><thead><tr><th>Nama</th><th>Perusahaan</th><th>Peran</th><th id="staff-access-column" hidden>Aksi</th></tr></thead><tbody id="accounts"></tbody></table>
        </div>
        <dialog id="staff-access-dialog" aria-labelledby="staff-access-heading">
          <h2 id="staff-access-heading">Hak Akses Staf</h2>
          <p id="staff-access-name"></p>
          <p id="staff-access-notice" role="status"></p>
          <form id="staff-access-form" hidden>
            <label>Master Data<select name="master_data"></select></label>
            <label>Proyek<select name="projects"></select></label>
            <label>Transaksi<select name="transactions"></select></label>
            <button type="submit">Simpan Hak Akses</button>
          </form>
          <form method="dialog"><button type="submit">Tutup</button></form>
        </dialog>
      </section>
      <div id="operations" hidden>
        <section id="master-data-panel" hidden>
          <h2>Master Data Perusahaan</h2>
          <form id="master-entry">
            <label>Jenis<select name="kind">
              <option value="project_category">Kategori Proyek</option>
              <option value="project_manager">Project Manager</option>
              <option value="transaction_category">Kategori Transaksi</option>
              <option value="payment_method">Metode Pembayaran</option>
              <option value="employee">Karyawan</option>
              <option value="equipment">Alat</option>
              <option value="goods">Barang</option>
            </select></label>
            <label>Nama<input name="name" maxlength="160" required></label>
            <button type="submit">Tambah Master Data</button>
          </form>
          <div class="table-scroll"><table><thead><tr><th>Jenis</th><th>Nama</th><th>Status</th></tr></thead><tbody id="master-rows"></tbody></table></div>
        </section>
        <section id="project-panel" hidden>
          <h2>Proyek</h2>
          <form id="project-entry">
            <label>Kode<input name="code" maxlength="40" required></label>
            <label>Nama proyek<input name="name" maxlength="160" required></label>
            <label>Nilai kontrak<input name="contract_value" type="number" min="0" step="0.01" value="0" required></label>
            <label>Mulai<input name="starts_on" type="date"></label>
            <label>Estimasi selesai<input name="ends_on" type="date"></label>
            <button type="submit">Tambah Proyek</button>
          </form>
          <div class="table-scroll"><table><thead><tr><th>Kode</th><th>Nama</th><th>Nilai Kontrak</th><th>Mulai</th><th>Estimasi Selesai</th></tr></thead><tbody id="project-rows"></tbody></table></div>
        </section>
        <section id="transaction-panel" hidden>
          <h2>Transaksi</h2>
          <form id="transaction-entry">
            <label>Proyek<select name="project_id" required></select></label>
            <label>Kategori<select name="category_id"></select></label>
            <label>Tanggal<input name="transaction_date" type="date" required></label>
            <label>Jenis<select name="transaction_type"><option value="MASUK">Masuk</option><option value="KELUAR">Keluar</option></select></label>
            <label>Jumlah<input name="amount" type="number" min="0.01" step="0.01" required></label>
            <label>Keterangan<input name="description" maxlength="240"></label>
            <button type="submit">Tambah Transaksi</button>
          </form>
          <div class="table-scroll"><table><thead><tr><th>Tanggal</th><th>Proyek</th><th>Jenis</th><th>Jumlah</th></tr></thead><tbody id="transaction-rows"></tbody></table></div>
        </section>
        <section id="report-panel" hidden>
          <h2>Ringkasan Keuangan Proyek</h2>
          <div class="table-scroll"><table><thead><tr><th>Proyek</th><th>Kontrak</th><th>Kas Masuk</th><th>Kas Keluar</th></tr></thead><tbody id="report-rows"></tbody></table></div>
        </section>
      </div>
    </div>
  </main>
</body>
</html>
