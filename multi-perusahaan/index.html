<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SiKoyek Multi-Perusahaan</title>
  <link rel="stylesheet" href="../foundation/tokens.css">
  <link rel="stylesheet" href="./workspace.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="./environment.js"></script>
  <script defer src="../foundation/config.js"></script>
  <script defer src="../foundation/backend.js"></script>
  <script defer src="./workspace.js"></script>
</head>
<body>
  <main id="workspace">
    <header>
      <img src="../sikoyek-sidebar-logo.webp" width="160" height="56" alt="SiKoyek">
      <button type="button" id="logout" hidden>Keluar</button>
    </header>
    <p id="notice" role="status"></p>
    <section id="login" hidden>
      <h1>Masuk</h1>
      <form id="login-form">
        <label>Email<input name="email" type="email" required autocomplete="username"></label>
        <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
        <button type="submit">Masuk</button>
      </form>
    </section>
    <div id="signed-in" hidden>
      <h1 id="workspace-title"></h1>
      <p id="account-name"></p>
      <section id="company-panel" hidden>
        <h2>Data Perusahaan</h2>
        <form id="company-form">
          <label>Nama perusahaan<input name="name" maxlength="160" required></label>
          <button type="submit">Tambah Perusahaan</button>
        </form>
        <div class="table-scroll">
          <table><thead><tr><th>Perusahaan</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="companies"></tbody></table>
        </div>
      </section>
      <section id="account-panel" hidden>
        <h2 id="account-heading"></h2>
        <form id="account-form">
          <label id="company-field">Perusahaan<select name="company_id"></select></label>
          <label>Nama lengkap<input name="full_name" maxlength="160" required autocomplete="off"></label>
          <label>Email<input name="email" type="email" required autocomplete="off"></label>
          <label>Password awal<input name="password" type="password" required minlength="8" autocomplete="new-password"></label>
          <button type="submit" id="account-submit"></button>
        </form>
        <div class="table-scroll">
          <table><thead><tr><th>Nama</th><th>Perusahaan</th><th>Peran</th></tr></thead><tbody id="accounts"></tbody></table>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
