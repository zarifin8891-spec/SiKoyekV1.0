<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>SiKoyek · Login Staging</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f7fb;color:#17304f;font:16px Arial,sans-serif}
main{background:white;border-radius:18px;padding:26px 32px;width:min(420px,calc(100% - 32px));box-sizing:border-box;box-shadow:0 12px 40px #17304f22}
h1{margin:0 0 8px}p{color:#52637a}label{display:block;margin:14px 0 5px}
input,button{box-sizing:border-box;padding:11px 12px;border:1px solid #aebed0;border-radius:8px;font:inherit}
input{width:100%}.password{display:flex;gap:8px}.password input{min-width:0}
button[type=submit]{width:100%;background:#173b67;color:white;border:0;margin-top:18px}button:disabled{opacity:.6}
</style>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js" integrity="sha384-uteMfOloLDGt042uDz+xHGF3ym63/WQ6rFq7murQRG8Ih7QrXGEGNtWd8688sb4O" crossorigin="anonymous"></script>
<script defer src="./staging-login-config.js"></script>
<script defer src="./staging-login.js"></script>
</head>
<body><main>
<h1>SiKoyek</h1>
<p>Masuk dengan akun uji. SiKoyek akan membuka ruang kerja yang sesuai.</p>
<form id="staging-login" method="post">
<label for="email">Email</label><input type="email" id="email" required autocomplete="username" maxlength="254">
<label for="password">Kata sandi</label>
<div class="password"><input type="password" id="password" required autocomplete="current-password" maxlength="1024">
<button type="button" id="show-password" aria-controls="password" aria-pressed="false">Tampilkan</button></div>
<button type="submit" id="sign-in" disabled>Masuk</button>
<p role="status" id="login-status"></p>
</form>
</main></body></html>
