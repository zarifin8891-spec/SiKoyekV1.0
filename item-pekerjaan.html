<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SiKoyek V1.0 — Item Pekerjaan</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Inter,system-ui,sans-serif;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5eaf1;border-radius:16px;padding:20px;margin-bottom:16px}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field select{width:100%;padding:11px;border:1px solid #d6dce6;border-radius:10px}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700;background:#245cff;color:#fff;cursor:pointer}.muted{color:#687386;font-size:13px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px;border-bottom:1px solid #e5eaf1;text-align:left}.total{font-size:18px;font-weight:800;margin-top:12px}.err{color:#c73737;margin-top:8px}</style></head><body><div class="wrap"><div id="app"></div></div><script>
const sb=supabase.createClient('https://mmkusplegmittrlxqxby.supabase.co','sb_publishable_m9qLt2yxWi6i40bo9ixR5A_QIbOLoyf',{auth:{persistSession:true,autoRefreshToken:true}});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let projects=[];
async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session){renderLogin();return}const{data,error}=await sb.from('projects').select('id,project_code,project_name').order('project_code');if(error){app.innerHTML='<div class="card err">'+esc(error.message)+'</div>';return}projects=data||[];render()}
function renderLogin(){app.innerHTML='<div class="card"><h1>SiKoyek V1.0</h1><p class="muted">Login Item Pekerjaan</p><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Password</label><input id="password" type="password"></div><button class="btn" onclick="login()">Masuk</button><div id="msg" class="err"></div></div>'}async function login(){const{error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)msg.textContent=error.message;else boot()}
async function load(){const pid=project.value;if(!pid){rows.innerHTML='<tr><td colspan="3">Pilih proyek.</td></tr>';total.textContent='Total Bobot: 0.00%';return}const{data,error}=await sb.from('project_work_items').select('work_name,weight,sort_order').eq('project_id',pid).order('sort_order');if(error){msg.textContent=error.message;return}const items=data||[];rows.innerHTML=items.map(i=>'<tr><td>'+esc(i.work_name)+'</td><td>'+((Number(i.weight)||0)*100).toFixed(2)+'%</td><td>'+Number(i.sort_order||0)+'</td></tr>').join('')||'<tr><td colspan="3">Belum ada item.</td></tr>';total.textContent='Total Bobot: '+(items.reduce((s,i)=>s+Number(i.weight||0),0)*100).toFixed(2)+'%'}
function render(){app.innerHTML='<div class="card"><h1>Item Pekerjaan</h1><p class="muted">Bobot disimpan sebagai desimal di database, tetapi selalu ditampilkan sebagai persen.</p><div class="field"><label>Proyek</label><select id="project" onchange="load()"><option value="">Pilih proyek</option>'+projects.map(p=>'<option value="'+p.id+'">'+esc(p.project_code)+' — '+esc(p.project_name)+'</option>').join('')+'</select></div></div><div class="card"><table class="table"><thead><tr><th>Item Pekerjaan</th><th>Bobot</th><th>Urutan</th></tr></thead><tbody id="rows"><tr><td colspan="3">Pilih proyek.</td></tr></tbody></table><div id="total" class="total">Total Bobot: 0.00%</div><div id="msg" class="err"></div></div>'}boot();</script></body></html>
