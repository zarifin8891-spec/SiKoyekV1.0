<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SiKoyek V1.0 — Item Pekerjaan</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="app-shell.css"></head><body><script src="app-shell.js"></script><script>
(async()=>{if(!await SK.requireSession())return;const root=SK.mountModule('Item Pekerjaan','Daftar item pekerjaan dan bobot per proyek.','items');let projects=[];root.innerHTML='<div class="card"><div class="field"><label>Proyek</label><select id="project"><option value="">Pilih proyek</option></select></div><div class="note">Bobot disimpan sebagai desimal di database, tetapi selalu ditampilkan sebagai persen.</div></div><div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>Item Pekerjaan</th><th>Bobot</th><th>Urutan</th></tr></thead><tbody id="rows"><tr><td colspan="3">Pilih proyek.</td></tr></tbody></table></div><div id="total" class="note">Total Bobot: 0.00%</div><div id="msg" class="msg"></div></div>';
const project=document.getElementById('project'),rows=document.getElementById('rows'),total=document.getElementById('total'),msg=document.getElementById('msg');const {data,error}=await SK.sb.from('projects').select('id,project_code,project_name').order('project_code');if(error){msg.className='msg err';msg.textContent=error.message;return}projects=data||[];project.innerHTML+='<option value=""></option>';projects.forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=p.project_code+' — '+p.project_name;project.appendChild(o)});project.addEventListener('change',load);
async function load(){const pid=project.value;if(!pid){rows.innerHTML='<tr><td colspan="3">Pilih proyek.</td></tr>';total.textContent='Total Bobot: 0.00%';return}const {data,error}=await SK.sb.from('project_work_items').select('work_name,weight,sort_order').eq('project_id',pid).order('sort_order');if(error){msg.className='msg err';msg.textContent=error.message;return}const items=data||[];rows.innerHTML=items.map(i=>`<tr><td>${SK.esc(i.work_name)}</td><td>${(Number(i.weight||0)*100).toFixed(2)}%</td><td>${Number(i.sort_order||0)}</td></tr>`).join('')||'<tr><td colspan="3">Belum ada item.</td></tr>';total.textContent='Total Bobot: '+(items.reduce((s,i)=>s+Number(i.weight||0),0)*100).toFixed(2)+'%';msg.textContent='';}
})();
</script></body></html>
