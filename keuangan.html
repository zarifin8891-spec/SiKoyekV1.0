<!doctype html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SiKoyek V1.0 — Keuangan</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Inter,system-ui,sans-serif;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5eaf1;border-radius:16px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d6dce6;border-radius:10px}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:#245cff;color:#fff}.muted{color:#687386;font-size:13px}.err{color:#c73737;font-size:13px;margin-top:8px}.ok{color:#11875d;font-size:13px;margin-top:8px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid #e5eaf1;text-align:left;font-size:13px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.kpi{font-size:24px;font-weight:800}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.small{font-size:12px;color:#687386}@media(max-width:700px){.grid,.cards{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div id="app"></div></div><script>
const sb=supabase.createClient('https://mmkusplegmittrlxqxby.supabase.co','sb_publishable_m9qLt2yxWi6i40bo9ixR5A_QIbOLoyf',{auth:{persistSession:true,autoRefreshToken:true}});const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n||0));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let projects=[];
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session)return login();const {data,error}=await sb.from('projects').select('id,project_code,project_name').order('project_code');if(error)return app.innerHTML='<div class="card err">'+esc(error.message)+'</div>';projects=data||[];render()}
function login(){app.innerHTML='<div class="card"><h1>SiKoyek V1.0</h1><p class="muted">Login Keuangan</p><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Password</label><input id="password" type="password"></div><button class="btn primary" onclick="signin()">Masuk</button><div id="msg" class="err"></div></div>'}async function signin(){const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)msg.textContent=error.message;else boot()}
async function loadTx(){const pid=project.value;if(!pid){document.getElementById('rows').innerHTML='<tr><td colspan="7">Pilih proyek.</td></tr>';return}const {data,error}=await sb.from('financial_transactions').select('*').eq('project_id',pid).order('transaction_date',{ascending:false});if(error){msg.textContent=error.message;return}const rows=data||[];const masuk=rows.filter(x=>x.transaction_type==='MASUK').reduce((s,x)=>s+Number(x.amount),0),keluar=rows.filter(x=>x.transaction_type==='KELUAR').reduce((s,x)=>s+Number(x.amount),0);cin.textContent=money(masuk);cout.textContent=money(keluar);net.textContent=money(masuk-keluar);document.getElementById('rows').innerHTML=rows.map(x=>'<tr><td>'+esc(x.transaction_date)+'</td><td>'+esc(x.transaction_type)+'</td><td>'+esc(x.category||'')+'</td><td>'+esc(x.description)+'</td><td>'+money(x.amount)+'</td><td>'+esc(x.payment_method||'')+'</td><td><button class="btn" onclick="removeTx(\''+x.id+'\')">Hapus</button></td></tr>').join('')||'<tr><td colspan="7">Belum ada transaksi.</td></tr>'}
async function save(){msg.textContent='';ok.textContent='';const pid=project.value,amt=Number(amount.value);if(!pid||!transaction_date.value||!transaction_type.value||!description.value.trim()||!(amt>0)){msg.textContent='Lengkapi data transaksi.';return}const {data:{user}}=await sb.auth.getUser();const {error}=await sb.from('financial_transactions').insert({project_id:pid,transaction_date:transaction_date.value,transaction_type:transaction_type.value,category:category.value.trim()||null,description:description.value.trim(),amount:amt,payment_method:payment_method.value.trim()||null,input_by:user?.id||null,notes:notes.value.trim()||null});if(error){msg.textContent=error.message;return}ok.textContent='Transaksi berhasil disimpan.';description.value='';amount.value='';category.value='';payment_method.value='';notes.value='';await loadTx()}
async function removeTx(id){if(!confirm('Hapus transaksi ini?'))return;const {error}=await sb.from('financial_transactions').delete().eq('id',id);if(error){msg.textContent=error.message;return}loadTx()}
function render(){app.innerHTML='<div class="card"><div class="top"><div><h1>Keuangan Proyek</h1><p class="muted">Catat Cash In dan Cash Out per proyek.</p></div><button class="btn" onclick="sb.auth.signOut().then(()=>location.reload())">Keluar</button></div></div><div class="card"><div class="grid"><div class="field"><label>Proyek</label><select id="project" onchange="loadTx()"><option value="">Pilih proyek</option>'+projects.map(p=>'<option value="'+p.id+'">'+esc(p.project_code)+' — '+esc(p.project_name)+'</option>').join('')+'</select></div><div class="field"><label>Tanggal</label><input id="transaction_date" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div><div class="field"><label>Jenis</label><select id="transaction_type"><option value="MASUK">MASUK</option><option value="KELUAR">KELUAR</option></select></div><div class="field"><label>Kategori</label><input id="category" placeholder="Material / Upah / Uang Muka / dll"></div><div class="field"><label>Deskripsi</label><input id="description" placeholder="Contoh: Pembelian semen"></div><div class="field"><label>Jumlah</label><input id="amount" type="number" min="1"></div><div class="field"><label>Metode Pembayaran</label><input id="payment_method" placeholder="Cash / Transfer"></div><div class="field"><label>Catatan</label><input id="notes"></div></div><button class="btn primary" onclick="save()">Simpan Transaksi</button><div id="msg" class="err"></div><div id="ok" class="ok"></div></div><div class="cards"><div class="card"><div class="small">CASH IN</div><div id="cin" class="kpi">Rp0</div></div><div class="card"><div class="small">CASH OUT</div><div id="cout" class="kpi">Rp0</div></div><div class="card"><div class="small">NET CASHFLOW</div><div id="net" class="kpi">Rp0</div></div></div><div class="card"><div style="overflow:auto"><table class="table"><thead><tr><th>Tanggal</th><th>Jenis</th><th>Kategori</th><th>Deskripsi</th><th>Jumlah</th><th>Metode</th><th>Aksi</th></tr></thead><tbody id="rows"><tr><td colspan="7">Pilih proyek.</td></tr></tbody></table></div></div>'}boot();</script></body></html>
