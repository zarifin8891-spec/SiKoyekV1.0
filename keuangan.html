<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SiKoyek V1.0 — Keuangan</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="app-shell.css"><style>
/* Compact financial KPI */
.finance-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.finance-kpi{padding:13px 18px;height:82px;display:flex;flex-direction:column;justify-content:center;border-radius:15px}
.finance-kpi .label{font-size:11px;line-height:1.15;color:var(--muted);font-weight:750;letter-spacing:.02em}
.finance-kpi .value{font-size:22px;line-height:1.15;font-weight:800;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cin{color:#11875d}
#cout{color:#c73737}
#net{color:#245cff}
@media(max-width:780px){.finance-kpis{grid-template-columns:1fr 1fr}.finance-kpi{height:76px;padding:11px 14px}.finance-kpi .value{font-size:19px}}
@media(max-width:520px){.finance-kpis{grid-template-columns:1fr}.finance-kpi{height:72px}}
</style></head><body><script src="app-shell.js"></script><script>
(async()=>{if(!await SK.requireSession())return;const root=SK.mountModule('Keuangan Proyek','Catat Cash In dan Cash Out per proyek.','keuangan');root.innerHTML='<div class="card"><div class="grid"><div class="field"><label>Proyek</label><select id="project"><option value="">Pilih proyek</option></select></div><div class="field"><label>Tanggal</label><input id="date" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div><div class="field"><label>Jenis</label><select id="type"><option value="MASUK">MASUK</option><option value="KELUAR">KELUAR</option></select></div><div class="field"><label>Kategori</label><input id="category" placeholder="Material / Upah / Uang Muka / dll"></div><div class="field"><label>Deskripsi</label><input id="description" placeholder="Contoh: Pembelian semen"></div><div class="field"><label>Jumlah</label><input id="amount" type="number" min="1"></div><div class="field"><label>Metode Pembayaran</label><input id="method" placeholder="Cash / Transfer"></div><div class="field"><label>Catatan</label><input id="notes"></div></div><button id="save" class="btn primary">Simpan Transaksi</button><div id="msg" class="msg"></div></div><div class="finance-kpis"><div class="card finance-kpi"><div class="label">KAS MASUK</div><div id="cin" class="value">Rp0</div></div><div class="card finance-kpi"><div class="label">KAS KELUAR</div><div id="cout" class="value">Rp0</div></div><div class="card finance-kpi"><div class="label">ARUS KAS BERSIH</div><div id="net" class="value">Rp0</div></div></div><div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>Tanggal</th><th>Jenis</th><th>Kategori</th><th>Deskripsi</th><th>Jumlah</th><th>Metode</th><th>Aksi</th></tr></thead><tbody id="rows"><tr><td colspan="7">Pilih proyek.</td></tr></tbody></table></div></div>';
const project=document.getElementById('project'),date=document.getElementById('date'),type=document.getElementById('type'),category=document.getElementById('category'),description=document.getElementById('description'),amount=document.getElementById('amount'),method=document.getElementById('method'),notes=document.getElementById('notes'),rows=document.getElementById('rows'),cin=document.getElementById('cin'),cout=document.getElementById('cout'),net=document.getElementById('net'),msg=document.getElementById('msg'),save=document.getElementById('save');const {data,error}=await SK.sb.from('projects').select('id,project_code,project_name').order('project_code');if(error){msg.className='msg err';msg.textContent=error.message;return}(data||[]).forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=p.project_code+' — '+p.project_name;project.appendChild(o)});project.addEventListener('change',load);save.addEventListener('click',saveTx);
async function load(){if(!project.value){rows.innerHTML='<tr><td colspan="7">Pilih proyek.</td></tr>';cin.textContent='Rp0';cout.textContent='Rp0';net.textContent='Rp0';return}const {data,error}=await SK.sb.from('financial_transactions').select('*').eq('project_id',project.value).order('transaction_date',{ascending:false});if(error){msg.className='msg err';msg.textContent=error.message;return}const list=data||[],masuk=list.filter(x=>x.transaction_type==='MASUK').reduce((s,x)=>s+Number(x.amount||0),0),keluar=list.filter(x=>x.transaction_type==='KELUAR').reduce((s,x)=>s+Number(x.amount||0),0);cin.textContent=SK.money(masuk);cout.textContent=SK.money(keluar);net.textContent=SK.money(masuk-keluar);rows.innerHTML=list.map(x=>`<tr><td>${SK.esc(x.transaction_date)}</td><td>${SK.esc(x.transaction_type)}</td><td>${SK.esc(x.category||'')}</td><td>${SK.esc(x.description)}</td><td>${SK.money(x.amount)}</td><td>${SK.esc(x.payment_method||'')}</td><td><button class="btn ghost" data-id="${x.id}">Hapus</button></td></tr>`).join('')||'<tr><td colspan="7">Belum ada transaksi.</td></tr>';rows.querySelectorAll('button[data-id]').forEach(b=>b.addEventListener('click',()=>removeTx(b.dataset.id)))}
async function saveTx(){msg.className='msg';msg.textContent='';if(!project.value||!date.value||!type.value||!description.value.trim()||!(Number(amount.value)>0)){msg.className='msg err';msg.textContent='Lengkapi data transaksi.';return}const {data:{user}}=await SK.sb.auth.getUser();const {error}=await SK.sb.from('financial_transactions').insert({project_id:project.value,transaction_date:date.value,transaction_type:type.value,category:category.value.trim()||null,description:description.value.trim(),amount:Number(amount.value),payment_method:method.value.trim()||null,input_by:user?.id||null,notes:notes.value.trim()||null});if(error){msg.className='msg err';msg.textContent=error.message;return}msg.className='msg ok';msg.textContent='Transaksi berhasil disimpan.';description.value='';amount.value='';category.value='';method.value='';notes.value='';await load()}
async function removeTx(id){if(!confirm('Hapus transaksi ini?'))return;const {error}=await SK.sb.from('financial_transactions').delete().eq('id',id);if(error){msg.className='msg err';msg.textContent=error.message;return}await load()}
})();
</script></body></html>
