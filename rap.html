<!doctype html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SiKoyek V1.0 — RAP</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Inter,system-ui,sans-serif;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:1050px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5eaf1;border-radius:16px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d6dce6;border-radius:10px}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:#245cff;color:#fff}.muted{color:#687386;font-size:13px}.err{color:#c73737;font-size:13px;margin-top:8px}.ok{color:#11875d;font-size:13px;margin-top:8px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid #e5eaf1;text-align:left;font-size:13px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div id="app"></div></div><script>
const sb=supabase.createClient('https://mmkusplegmittrlxqxby.supabase.co','sb_publishable_m9qLt2yxWi6i40bo9ixR5A_QIbOLoyf',{auth:{persistSession:true,autoRefreshToken:true}});const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n||0));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let projects=[];
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session)return login();const {data,error}=await sb.from('projects').select('id,project_code,project_name').order('project_code');if(error)return app.innerHTML='<div class="card err">'+esc(error.message)+'</div>';projects=data||[];render()}
function login(){app.innerHTML='<div class="card"><h1>SiKoyek V1.0</h1><p class="muted">Login RAP</p><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Password</label><input id="password" type="password"></div><button class="btn primary" onclick="signin()">Masuk</button><div id="msg" class="err"></div></div>'}async function signin(){const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)msg.textContent=error.message;else boot()}
async function loadRap(){const pid=project.value;if(!pid){document.getElementById('summary').innerHTML='Pilih proyek.';return}const {data,error}=await sb.from('project_rap').select('*').eq('project_id',pid).maybeSingle();if(error){msg.textContent=error.message;return}const r=data||{material:0,labor:0,equipment:0,operational:0,subcontract:0,other:0};['material','labor','equipment','operational','subcontract','other'].forEach(k=>document.getElementById(k).value=Number(r[k]||0));showSummary(r)}function showSummary(r){const total=['material','labor','equipment','operational','subcontract','other'].reduce((s,k)=>s+Number(r[k]||0),0);summary.innerHTML='<h3>Total RAP: '+money(total)+'</h3><div class="table"><table class="table"><tr><th>Kategori</th><th>Nilai</th></tr>'+[['Material',r.material],['Upah',r.labor],['Alat',r.equipment],['Operasional',r.operational],['Subkon',r.subcontract],['Lain-Lain',r.other]].map(x=>'<tr><td>'+x[0]+'</td><td>'+money(x[1])+'</td></tr>').join('')+'</table></div>'}
async function save(){msg.textContent='';ok.textContent='';const pid=project.value;if(!pid){msg.textContent='Pilih proyek.';return}const payload={project_id:pid,material:+material.value||0,labor:+labor.value||0,equipment:+equipment.value||0,operational:+operational.value||0,subcontract:+subcontract.value||0,other:+other.value||0};const {error}=await sb.from('project_rap').upsert(payload,{onConflict:'project_id'});if(error){msg.textContent=error.message;return}ok.textContent='RAP berhasil disimpan.';showSummary(payload)}
function render(){app.innerHTML='<div class="card"><div class="top"><div><h1>RAP Proyek</h1><p class="muted">RAP V1.0 disimpan per proyek dalam 6 kategori.</p></div><button class="btn" onclick="sb.auth.signOut().then(()=>location.reload())">Keluar</button></div></div><div class="card"><div class="grid"><div class="field"><label>Proyek</label><select id="project" onchange="loadRap()"><option value="">Pilih proyek</option>'+projects.map(p=>'<option value="'+p.id+'">'+esc(p.project_code)+' — '+esc(p.project_name)+'</option>').join('')+'</select></div><div class="field"><label>Material</label><input id="material" type="number" min="0"></div><div class="field"><label>Upah</label><input id="labor" type="number" min="0"></div><div class="field"><label>Alat</label><input id="equipment" type="number" min="0"></div><div class="field"><label>Operasional</label><input id="operational" type="number" min="0"></div><div class="field"><label>Subkon</label><input id="subcontract" type="number" min="0"></div><div class="field"><label>Lain-Lain</label><input id="other" type="number" min="0"></div></div><button class="btn primary" onclick="save()">Simpan RAP</button><div id="msg" class="err"></div><div id="ok" class="ok"></div></div><div class="card" id="summary">Pilih proyek.</div>'}boot();</script></body></html>
