<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SiKoyek V1.0 — RAP</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="app-shell.css"></head><body><script src="app-shell.js"></script><script>
(async()=>{if(!await SK.requireSession())return;const root=SK.mountModule('RAP Proyek','RAP V1.0 disimpan per proyek dalam 6 kategori.','rap');root.innerHTML='<div class="card"><div class="field"><label>Proyek</label><select id="project"><option value="">Pilih proyek</option></select></div><div class="grid"><div class="field"><label>Material</label><input id="material" type="number" min="0"></div><div class="field"><label>Upah</label><input id="labor" type="number" min="0"></div><div class="field"><label>Alat</label><input id="equipment" type="number" min="0"></div><div class="field"><label>Operasional</label><input id="operational" type="number" min="0"></div><div class="field"><label>Subkon</label><input id="subcontract" type="number" min="0"></div><div class="field"><label>Lain-Lain</label><input id="other" type="number" min="0"></div></div><button id="save" class="btn primary">Simpan RAP</button><div id="msg" class="msg"></div></div><div class="card"><div id="summary">Pilih proyek.</div></div>';
const project=document.getElementById('project'),summary=document.getElementById('summary'),msg=document.getElementById('msg'),save=document.getElementById('save');const fields=['material','labor','equipment','operational','subcontract','other'];const {data,error}=await SK.sb.from('projects').select('id,project_code,project_name').order('project_code');if(error){msg.className='msg err';msg.textContent=error.message;return}(data||[]).forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=p.project_code+' — '+p.project_name;project.appendChild(o)});project.addEventListener('change',load);save.addEventListener('click',saveRap);
async function load(){if(!project.value){summary.textContent='Pilih proyek.';return}const {data,error}=await SK.sb.from('project_rap').select('*').eq('project_id',project.value).maybeSingle();if(error){msg.className='msg err';msg.textContent=error.message;return}const r=data||{};fields.forEach(k=>document.getElementById(k).value=Number(r[k]||0));show(r)}
function show(r){const total=fields.reduce((s,k)=>s+Number(r[k]||0),0);summary.innerHTML='<h2 style="margin-top:0">Total RAP: '+SK.money(total)+'</h2><div class="tablewrap"><table class="table"><thead><tr><th>Kategori</th><th>Nilai</th></tr></thead><tbody>'+[['Material',r.material],['Upah',r.labor],['Alat',r.equipment],['Operasional',r.operational],['Subkon',r.subcontract],['Lain-Lain',r.other]].map(x=>'<tr><td>'+x[0]+'</td><td>'+SK.money(x[1])+'</td></tr>').join('')+'</tbody></table></div>'}
async function saveRap(){msg.className='msg';msg.textContent='';if(!project.value){msg.className='msg err';msg.textContent='Pilih proyek.';return}const payload={project_id:project.value,material:+material.value||0,labor:+labor.value||0,equipment:+equipment.value||0,operational:+operational.value||0,subcontract:+subcontract.value||0,other:+other.value||0};const {error}=await SK.sb.from('project_rap').upsert(payload,{onConflict:'project_id'});if(error){msg.className='msg err';msg.textContent=error.message;return}msg.className='msg ok';msg.textContent='RAP berhasil disimpan.';show(payload)}
})();
</script></body></html>
