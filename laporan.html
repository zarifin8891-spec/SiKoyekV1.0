<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SiKoyek V1.0 — Laporan</title>
<link rel="stylesheet" href="./app-shell.css?v=2">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="sidebrand">SiKoyek <b>V1.0</b></div>
    <nav class="nav">
      <a href="index.html">Dashboard</a>
      <a href="workspace.html">Daftar Proyek</a>
      <a href="laporan.html" class="active">Laporan</a>
    </nav>
  </aside>
  <main class="content">
    <div class="top">
      <div>
        <h1>Laporan</h1>
        <p class="muted">Ringkasan dan laporan Project Control.</p>
      </div>
      <button class="btn ghost" id="logoutBtn">Keluar</button>
    </div>
    <div id="page"></div>
  </main>
</div>
<script src="./app-shell.js?v=7"></script>
<script src="./laporan-v1.js?v=4"></script>
<script src="./laporan-shell-clean-v1.js?v=4"></script>
<script>
(async function(){
  try{
    const session=await window.SK?.requireSession?.();
    if(!session)return;
    if(typeof window.openLaporan==='function')await window.openLaporan();
    else throw new Error('Renderer Laporan tidak tersedia.');
  }catch(e){
    console.error('SiKoyek Laporan boot:',e);
    const p=document.getElementById('page');
    if(p)p.innerHTML='<div class="card"><div class="empty">Gagal memuat Laporan: '+String(e?.message||e)+'</div></div>';
  }
})();
</script>
</body>
</html>
