<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SiKoyek V1.0 — Workspace</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<link rel="stylesheet" href="./foundation/tokens.css">
<link rel="stylesheet" href="./foundation/workspace.css">
<script src="./foundation/runtime.js"></script>
<script src="./foundation/backend.js"></script>
<script src="./foundation/repository.js"></script>
</head>
<body><div id="app"></div><script>
const sb=window.SiKoyekBackend.getClient('https://mmkusplegmittrlxqxby.supabase.co','sb_publishable_m9qLt2yxWi6i40bo9ixR5A_QIbOLoyf',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const money=n=>window.SiKoyekFoundation.money(n);
const pct=n=>Number(n||0).toFixed(2)+'%';
const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
let summary=[];
function loginHTML(){return `<div class="login"><div class="box"><h1>SiKoyek <span style="color:#245cff">V1.0</span></h1><p class="muted">Project Control Workspace</p><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Password</label><input id="password" type="password"></div><button class="btn primary" onclick="login()">Masuk</button><div id="msg" class="err"></div></div></div>`}
async function login(){const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)msg.textContent=error.message;else boot()}
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){app.innerHTML=loginHTML();return}await load();render()}
async function load(){const {data,error}=await sb.from('project_summary').select('*').order('project_code');if(error){summary=[];throw error}summary=data||[]}
function go(file){window.location.href=file}
function healthCount(s){return summary.filter(x=>x.health_status===s).length}
function render(){const sum=k=>summary.reduce((t,x)=>t+Number(x[k]||0),0);const avg=summary.length?sum('project_progress')/summary.length:0;app.innerHTML=`<div class="shell"><aside class="side"><div class="brand">SiKoyek <b>V1.0</b></div><button onclick="go('index.html')">Dashboard</button><button onclick="go('progress.html')">Progress</button><button onclick="go('rap.html')">RAP</button><button onclick="go('keuangan.html')">Keuangan</button><button onclick="go('https://github.com/zarifin8891-spec/SiKoyekV1.0')">Repository</button><div class="foot">Supabase • Project Control</div></aside><main class="main"><div class="top"><div><h1>SiKoyek Workspace</h1><p class="muted">Satu pintu untuk seluruh modul Project Control.</p></div><button class="btn ghost" onclick="sb.auth.signOut().then(()=>location.reload())">Keluar</button></div><div class="cards"><div class="card"><div class="label">TOTAL PROYEK</div><div class="value">${summary.length}</div></div><div class="card"><div class="label">NILAI KONTRAK</div><div class="value">${money(sum('contract_value'))}</div></div><div class="card"><div class="label">TOTAL RAP</div><div class="value">${money(sum('total_rap'))}</div></div><div class="card"><div class="label">AVG PROGRESS</div><div class="value">${pct(avg)}</div></div></div><div class="tools"><button class="tool" onclick="go('index.html')"><h3>Dashboard</h3><p>Portfolio, KPI, Cost Ratio, RAP Consumption, Cashflow dan Project Health.</p></button><button class="tool" onclick="go('progress.html')"><h3>Progress</h3><p>Input progress tambahan per item pekerjaan dan lihat progress proyek.</p></button><button class="tool" onclick="go('rap.html')"><h3>RAP Proyek</h3><p>Kelola RAP Material, Upah, Alat, Operasional, Subkon, dan Lain-Lain.</p></button><button class="tool" onclick="go('keuangan.html')"><h3>Keuangan</h3><p>Catat Cash In/Cash Out dan lihat posisi cashflow per proyek.</p></button><button class="tool" onclick="go('index.html')"><h3>Projects</h3><p>Buka daftar proyek dan masuk ke detail proyek.</p></button><button class="tool" onclick="go('index.html')"><h3>Cost Control</h3><p>Lihat RAP vs realisasi dan konsumsi anggaran.</p></button></div><div class="health"><div class="h green"><div class="big">${healthCount('SEHAT')}</div><div>SEHAT</div></div><div class="h amber"><div class="big">${healthCount('PERLU PENGAWASAN')}</div><div>PERLU PENGAWASAN</div></div><div class="h red"><div class="big">${healthCount('BERISIKO')}</div><div>BERISIKO</div></div></div><div class="projects card"><div class="top" style="margin-bottom:8px"><div><h2 style="margin:0">Project Control</h2><p class="muted" style="margin:5px 0 0">Ringkasan proyek aktif.</p></div></div><div style="overflow:auto"><table class="table"><thead><tr><th>Proyek</th><th>Progress</th><th>Cost Ratio</th><th>RAP Consumption</th><th>Status</th></tr></thead><tbody>${summary.map(x=>`<tr><td><strong>${esc(x.project_code)}</strong> — ${esc(x.project_name)}</td><td>${pct(x.project_progress)}</td><td>${pct(x.cost_ratio)}</td><td>${pct(x.rap_consumption)}</td><td><span class="pill ${x.health_status==='SEHAT'?'green':x.health_status==='BERISIKO'?'red':'amber'}">${esc(x.health_status)}</span></td></tr>`).join('')}</tbody></table></div></div></main></div>`}
boot().catch(e=>{app.innerHTML='<div class="login"><div class="box"><h2>SiKoyek</h2><div class="err">'+esc(e.message)+'</div></div></div>'});
</script></body></html>
