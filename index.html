<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SiKoyek V1.0</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#687386;--line:#dfe5ee;--blue:#245cff;--red:#c73737;--green:#11875d}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input{font:inherit}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.box{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;padding:32px;box-shadow:0 14px 40px #17203316}.brand{font-size:30px;font-weight:800}.brand b{color:var(--blue)}h1{font-size:24px;margin:10px 0 6px}p{color:var(--muted)}label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}input{width:100%;padding:13px;border:1px solid #cfd7e3;border-radius:10px}button{width:100%;margin-top:16px;border:0;border-radius:10px;padding:13px;font-weight:800;background:var(--blue);color:#fff;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.msg{margin-top:12px;font-size:13px;line-height:1.45}.err{color:var(--red)}.ok{color:var(--green)}.app{min-height:100vh}.topbar{background:#111827;color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px}.topbar .small{font-size:12px;color:#cbd5e1}.nav{display:flex;gap:8px;flex-wrap:wrap;padding:18px 22px;background:#fff;border-bottom:1px solid var(--line)}.nav a{display:inline-block;padding:10px 13px;border:1px solid var(--line);border-radius:9px;text-decoration:none;color:var(--text);font-weight:750}.nav a:hover{border-color:var(--blue);color:var(--blue)}.content{padding:22px}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px}.label{font-size:11px;color:var(--muted);font-weight:800}.value{font-size:23px;font-weight:850;margin-top:7px}.tablewrap{overflow:auto;margin-top:18px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;font-size:13px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}.green{background:#eaf8f2;color:var(--green)}.red{background:#fff0f0;color:var(--red)}.amber{background:#fff6df;color:#a56a00}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.cards{grid-template-columns:1fr}.box{padding:24px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
(() => {
  const SUPABASE_URL='https://mmkusplegmittrlxqxby.supabase.co';
  const SUPABASE_KEY='sb_publishable_m9qLt2yxWi6i40bo9ixR5A_QIbOLoyf';
  const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  const root=document.getElementById('root');
  const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n||0));
  const pct=n=>Number(n||0).toFixed(2)+'%';
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const healthClass=s=>s==='SEHAT'?'green':s==='BERISIKO'?'red':'amber';

  function loginView(){
    root.innerHTML=`<div class="login"><div class="box"><div class="brand">SiKoyek <b>V1.0</b></div><h1>Project Control System</h1><p>Masuk untuk membuka dashboard proyek.</p><form id="loginForm"><label for="email">Email</label><input id="email" type="email" autocomplete="username" placeholder="nama@email.com" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button id="loginBtn" type="submit">Masuk</button><div id="loginMsg" class="msg"></div></form></div></div>`;
    document.getElementById('loginForm').addEventListener('submit', async e=>{
      e.preventDefault();
      const btn=document.getElementById('loginBtn');
      const msg=document.getElementById('loginMsg');
      msg.className='msg'; msg.textContent=''; btn.disabled=true; btn.textContent='Memproses...';
      try{
        const email=document.getElementById('email').value.trim();
        const password=document.getElementById('password').value;
        const {error}=await sb.auth.signInWithPassword({email,password});
        if(error) throw error;
        msg.className='msg ok'; msg.textContent='Login berhasil. Membuka dashboard...';
        setTimeout(loadApp,300);
      }catch(err){
        msg.className='msg err'; msg.textContent=err?.message||'Login gagal.';
        btn.disabled=false; btn.textContent='Masuk';
      }
    });
  }

  async function loadApp(){
    const {data,error}=await sb.from('project_summary').select('*').order('project_code');
    if(error){root.innerHTML=`<div class="login"><div class="box"><div class="brand">SiKoyek <b>V1.0</b></div><div class="msg err">Gagal membaca Dashboard: ${esc(error.message)}</div></div></div>`;return;}
    renderDashboard(data||[]);
  }

  function renderDashboard(rows){
    const sum=k=>rows.reduce((t,x)=>t+Number(x[k]||0),0);
    const avg=rows.length?sum('project_progress')/rows.length:0;
    root.innerHTML=`<div class="app"><div class="topbar"><div><strong>SiKoyek V1.0</strong><div class="small">Project Control System</div></div><button id="logout" style="width:auto;margin:0;background:#fff;color:#172033;padding:9px 12px">Keluar</button></div><div class="nav"><a href="index.html">Dashboard</a><a href="workspace.html">Workspace</a><a href="progress.html">Progress</a><a href="rap.html">RAP</a><a href="keuangan.html">Keuangan</a></div><main class="content"><div class="cards"><div class="card"><div class="label">TOTAL PROYEK</div><div class="value">${rows.length}</div></div><div class="card"><div class="label">NILAI KONTRAK</div><div class="value">${money(sum('contract_value'))}</div></div><div class="card"><div class="label">TOTAL RAP</div><div class="value">${money(sum('total_rap'))}</div></div><div class="card"><div class="label">TOTAL REALISASI</div><div class="value">${money(sum('total_realization'))}</div></div><div class="card"><div class="label">AVG PROGRESS</div><div class="value">${pct(avg)}</div></div></div><div class="tablewrap"><div class="card" style="padding:0"><table class="table"><thead><tr><th>Proyek</th><th>Progress</th><th>Cost Ratio</th><th>RAP Consumption</th><th>Health</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.project_code)} — ${esc(r.project_name)}</td><td>${pct(r.project_progress)}</td><td>${pct(r.cost_ratio)}</td><td>${pct(r.rap_consumption)}</td><td><span class="pill ${healthClass(r.health_status)}">${esc(r.health_status)}</span></td></tr>`).join('')}</tbody></table></div></div></main></div>`;
    document.getElementById('logout').addEventListener('click',async()=>{await sb.auth.signOut();loginView();});
  }

  async function boot(){
    try{
      const {data:{session},error}=await sb.auth.getSession();
      if(error) throw error;
      if(session){await loadApp();} else {loginView();}
    }catch(err){root.innerHTML=`<div class="login"><div class="box"><div class="brand">SiKoyek <b>V1.0</b></div><div class="msg err">${esc(err?.message||'Gagal memulai aplikasi.')}</div></div></div>`;}
  }
  boot();
})();
</script>
</body>
</html>
