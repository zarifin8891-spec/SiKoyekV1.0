<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SiKoyek V1.0 — Project Control</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#687386;--line:#e5eaf1;--blue:#245cff;--green:#11875d;--green2:#eaf8f2;--amber:#a56a00;--amber2:#fff6df;--red:#c73737;--red2:#fff0f0;--nav:#111827}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.loginbox{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:0 12px 36px #17203312}.brand{font-size:28px;font-weight:800}.brand b,.sidebrand b{color:var(--blue)}.loginbox h2{margin:8px 0 4px}.loginbox p{margin:0 0 24px;color:var(--muted)}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid #d6dce6;border-radius:10px;background:#fff}.field textarea{min-height:90px;resize:vertical}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:750;cursor:pointer}.primary{background:var(--blue);color:#fff}.full{width:100%;margin-top:8px}.ghost{background:#fff;border:1px solid var(--line);color:var(--text)}.err{margin-top:12px;color:var(--red);font-size:13px}.shell{min-height:100vh;display:grid;grid-template-columns:235px 1fr}.sidebar{background:var(--nav);color:#fff;padding:20px 14px;display:flex;flex-direction:column}.sidebrand{font-size:22px;font-weight:800;padding:5px 10px 22px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#cbd5e1;text-align:left;padding:11px 12px;border-radius:10px;cursor:pointer}.nav button.active,.nav button:hover{background:#202938;color:#fff}.sidefoot{margin-top:auto;padding:12px;color:#94a3b8;font-size:12px}.content{padding:26px;overflow:auto}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:20px}.top h1{margin:0;font-size:28px}.top p{margin:6px 0 0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px}.kpi{padding:17px}.kpi .label{font-size:12px;color:var(--muted);font-weight:750}.kpi .value{font-size:23px;font-weight:850;margin-top:8px}.section{margin-top:18px}.sectiontitle{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px}.sectiontitle h2{font-size:17px;margin:0}.health{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.health .box{padding:18px;border-radius:16px;border:1px solid var(--line)}.box.green{background:var(--green2)}.box.amber{background:var(--amber2)}.box.red{background:var(--red2)}.big{font-size:29px;font-weight:850}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:850}.pill.green{background:var(--green2);color:var(--green)}.pill.amber{background:var(--amber2);color:var(--amber)}.pill.red{background:var(--red2);color:var(--red)}.tablecard{overflow:hidden}.scroll{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 13px;border-bottom:1px solid var(--line);font-size:13px;white-space:nowrap;text-align:left}.table th{font-size:10px;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;background:#fafbfd}.linkbtn{border:0;background:transparent;color:var(--blue);font-weight:800;cursor:pointer;padding:0}.bar{height:8px;background:#edf1f6;border-radius:999px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue)}.detailhead{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.detailtitle h2{margin:0;font-size:23px}.detailtitle p{margin:5px 0;color:var(--muted)}.tabs{display:flex;gap:6px;overflow:auto;margin:18px 0}.tabs button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;cursor:pointer;font-weight:750;white-space:nowrap}.tabs button.active{background:var(--blue);border-color:var(--blue);color:#fff}.detailgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:15px}.empty{padding:28px;text-align:center;color:var(--muted)}.note{font-size:12px;color:var(--muted);margin-top:8px}.modal{position:fixed;inset:0;background:#11182766;display:grid;place-items:center;padding:18px;z-index:50}.modalbox{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.modalhead h3{margin:0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.formactions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.toast{position:fixed;right:18px;bottom:18px;background:#111827;color:#fff;padding:12px 14px;border-radius:10px;z-index:70;font-size:13px}.search{width:250px;max-width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
@media(max-width:1100px){.cards{grid-template-columns:repeat(3,1fr)}.detailgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:780px){.shell{grid-template-columns:1fr}.sidebar{position:sticky;top:0;z-index:5;flex-direction:row;align-items:center;padding:10px}.sidebrand{padding:0 10px}.nav{display:flex;overflow:auto}.sidefoot{display:none}.content{padding:17px}.health,.twocol{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}.detailhead{flex-direction:column}.formgrid{grid-template-columns:1fr}}@media(max-width:520px){.cards,.detailgrid{grid-template-columns:1fr}.top{flex-direction:column}.top h1{font-size:22px}}
</style>
</head>
<body><div id="app"></div><script>
const SUPABASE_URL='https://mmkusplegmittrlxqxby.supabase.co';
const SUPABASE_KEY='sb_publishable_m9qLt2yxWi6i40bo9ixR5A_QIbOLoyf';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n||0));
const pct=n=>Number(n||0).toFixed(2)+'%';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
let state={page:'dashboard',summary:[],selected:null,detailTab:'overview',detail:null,search:''};
function healthClass(s){return s==='SEHAT'?'green':s==='BERISIKO'?'red':'amber'}
function toast(msg){const d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function loginHTML(){return `<div class="login"><div class="loginbox"><div class="brand">SiKoyek <b>V1.0</b></div><h2>Project Control System</h2><p>Masuk untuk membuka dashboard proyek.</p><div class="field"><label>Email</label><input id="email" type="email" placeholder="nama@email.com"></div><div class="field"><label>Password</label><input id="password" type="password" placeholder="••••••••"></div><button class="btn primary full" onclick="login()">Masuk</button><div id="loginErr" class="err"></div></div></div>`}
async function login(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const {error}=await sb.auth.signInWithPassword({email,password});if(error)document.getElementById('loginErr').textContent=error.message}
async function logout(){await sb.auth.signOut();location.reload()}
function nav(active){return `<aside class="sidebar"><div class="sidebrand">SiKoyek <b>V1.0</b></div><div class="nav"><button class="${active==='dashboard'?'active':''}" onclick="go('dashboard')">Dashboard</button><button class="${active==='projects'||active==='detail'?'active':''}" onclick="go('projects')">Projects</button></div><div class="sidefoot">Project Control • V1.0</div></aside>`}
async function loadSummary(){const {data,error}=await sb.from('project_summary').select('*').order('project_code');if(error){toast(error.message);state.summary=[]}else state.summary=data||[]}
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){document.getElementById('app').innerHTML=loginHTML();return}await loadSummary();renderApp()}
async function go(page){state.page=page;state.selected=null;state.detail=null;await loadSummary();renderApp()}
function renderApp(){document.getElementById('app').innerHTML=`<div class="shell">${nav(state.page)}<main class="content"><div id="page"></div></main></div>`;renderPage()}
function renderPage(){const el=document.getElementById('page');if(state.page==='dashboard')el.innerHTML=dashboard();else if(state.page==='projects')el.innerHTML=projects();else renderDetail(el)}
function dashboard(){const a=state.summary,sum=k=>a.reduce((t,x)=>t+Number(x[k]||0),0),avg=a.length?sum('project_progress')/a.length:0,g=a.filter(x=>x.health_status==='SEHAT').length,w=a.filter(x=>x.health_status==='PERLU PENGAWASAN').length,r=a.filter(x=>x.health_status==='BERISIKO').length;return `<div class="top"><div><h1>Dashboard</h1><p>Ringkasan kondisi portfolio proyek.</p></div><div class="actions"><button class="btn primary" onclick="openProjectForm()">+ Proyek Baru</button><button class="btn ghost" onclick="logout()">Keluar</button></div></div><div class="cards"><div class="card kpi"><div class="label">TOTAL PROYEK</div><div class="value">${a.length}</div></div><div class="card kpi"><div class="label">NILAI KONTRAK</div><div class="value">${money(sum('contract_value'))}</div></div><div class="card kpi"><div class="label">TOTAL RAP</div><div class="value">${money(sum('total_rap'))}</div></div><div class="card kpi"><div class="label">TOTAL REALISASI</div><div class="value">${money(sum('total_realization'))}</div></div><div class="card kpi"><div class="label">AVG PROGRESS</div><div class="value">${pct(avg)}</div></div></div><div class="section"><div class="health"><div class="box green"><div class="big">${g}</div><div>SEHAT</div></div><div class="box amber"><div class="big">${w}</div><div>PERLU PENGAWASAN</div></div><div class="box red"><div class="big">${r}</div><div>BERISIKO</div></div></div></div><div class="section"><div class="sectiontitle"><h2>Project Health</h2><button class="linkbtn" onclick="go('projects')">Lihat semua →</button></div><div class="card tablecard"><div class="scroll"><table class="table"><thead><tr><th>Proyek</th><th>Progress</th><th>Cost Ratio</th><th>RAP Consumption</th><th>Status</th></tr></thead><tbody>${a.map(x=>`<tr><td><button class="linkbtn" onclick="openProject('${x.project_id}')">${esc(x.project_code)} — ${esc(x.project_name)}</button></td><td>${pct(x.project_progress)}</td><td>${pct(x.cost_ratio)}</td><td>${pct(x.rap_consumption)}</td><td><span class="pill ${healthClass(x.health_status)}">${esc(x.health_status)}</span></td></tr>`).join('')}</tbody></table></div></div></div></div>`}
function projects(){const q=state.search.toLowerCase(),a=state.summary.filter(x=>(x.project_code+' '+x.project_name).toLowerCase().includes(q));return `<div class="top"><div><h1>Projects</h1><p>Kelola proyek dan masuk ke detail operasional.</p></div><div class="actions"><input class="search" value="${esc(state.search)}" oninput="state.search=this.value;renderPage()" placeholder="Cari proyek..."><button class="btn primary" onclick="openProjectForm()">+ Proyek Baru</button></div></div><div class="card tablecard"><div class="scroll"><table class="table"><thead><tr><th>Kode</th><th>Nama Proyek</th><th>Kontrak</th><th>RAP</th><th>Progress</th><th>Cost Ratio</th><th>RAP Consumption</th><th>Health</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.project_code)}</td><td><button class="linkbtn" onclick="openProject('${x.project_id}')">${esc(x.project_name)}</button></td><td>${money(x.contract_value)}</td><td>${money(x.total_rap)}</td><td>${pct(x.project_progress)}</td><td>${pct(x.cost_ratio)}</td><td>${pct(x.rap_consumption)}</td><td><span class="pill ${healthClass(x.health_status)}">${esc(x.health_status)}</span></td></tr>`).join('')||'<tr><td colspan="8" class="empty">Belum ada proyek.</td></tr>'}</tbody></table></div></div>`}
async function openProject(id){state.page='detail';state.selected=id;state.detailTab='overview';state.detail=await getDetail(id);renderApp()}
async function getDetail(id){const [{data:project,error:e1},{data:items,error:e2},{data:rap,error:e3},{data:fin,error:e4},{data:progress,error:e5}]=await Promise.all([sb.from('projects').select('*').eq('id',id).single(),sb.from('project_work_items').select('*').eq('project_id',id).order('sort_order'),sb.from('project_rap').select('*').eq('project_id',id).maybeSingle(),sb.from('financial_transactions').select('*').eq('project_id',id).order('transaction_date',{ascending:false}),sb.from('progress_records').select('*').eq('project_id',id).order('progress_date',{ascending:false})]);const err=[e1,e2,e3,e4,e5].find(Boolean);if(err)toast(err.message);return {project,items:items||[],rap,fin:fin||[],progress:progress||[]}}
function renderDetail(el){if(!state.detail){el.innerHTML='<div class="empty">Memuat proyek...</div>';return}const d=state.detail,s=state.summary.find(x=>x.project_id===state.selected);const labels={overview:'Overview',pekerjaan:'Item Pekerjaan',progress:'Progress',rap:'RAP',keuangan:'Keuangan',cost:'Cost Control'};el.innerHTML=`<div class="top"><div class="detailtitle"><h2>${esc(d.project.project_name)}</h2><p>${esc(d.project.project_code)} • ${esc(d.project.location||'-')} • ${esc(d.project.status)}</p></div><div class="actions"><button class="btn ghost" onclick="go('projects')">← Kembali</button><button class="btn primary" onclick="openItemForm()">+ Item Pekerjaan</button><button class="btn ghost" onclick="openTxForm()">+ Transaksi</button></div></div><div class="detailgrid"><div class="card kpi"><div class="label">NILAI KONTRAK</div><div class="value">${money(d.project.contract_value)}</div></div><div class="card kpi"><div class="label">RAP</div><div class="value">${money(s?.total_rap)}</div></div><div class="card kpi"><div class="label">PROGRESS</div><div class="value">${pct(s?.project_progress)}</div></div><div class="card kpi"><div class="label">HEALTH</div><div class="value"><span class="pill ${healthClass(s?.health_status)}">${esc(s?.health_status||'-')}</span></div></div></div><div class="tabs">${Object.entries(labels).map(([k,v])=>`<button class="${state.detailTab===k?'active':''}" onclick="setTab('${k}')">${v}</button>`).join('')}</div><div>${detailBody(d,s)}</div>`}
function setTab(t){state.detailTab=t;renderApp()}
function detailBody(d,s){if(state.detailTab==='overview')return overview(d,s);if(state.detailTab==='pekerjaan')return workitems(d);if(state.detailTab==='progress')return progressView(d);if(state.detailTab==='rap')return rapView(d,s);if(state.detailTab==='keuangan')return financeView(d);return costView(d,s)}
function overview(d,s){return `<div class="twocol"><div class="card kpi"><div class="sectiontitle"><h2>Progress</h2></div><div style="font-size:34px;font-weight:850">${pct(s?.project_progress)}</div><div class="bar" style="margin-top:12px"><i style="width:${Math.min(100,Number(s?.project_progress||0))}%"></i></div><div class="note">Progress dihitung dari bobot Item Pekerjaan.</div></div><div class="card kpi"><div class="sectiontitle"><h2>Biaya</h2></div><div class="note">Cost Ratio</div><div style="font-size:25px;font-weight:850">${pct(s?.cost_ratio)}</div><div class="note">RAP Consumption</div><div style="font-size:25px;font-weight:850">${pct(s?.rap_consumption)}</div></div></div><div class="section"><div class="card kpi"><div class="sectiontitle"><h2>Informasi Proyek</h2></div><div class="twocol"><div><div class="note">Pemilik</div><strong>${esc(d.project.owner_name||'-')}</strong></div><div><div class="note">Project Manager</div><strong>${esc(d.project.project_manager||'-')}</strong></div><div><div class="note">Mulai</div><strong>${esc(d.project.start_date||'-')}</strong></div><div><div class="note">Target Selesai</div><strong>${esc(d.project.end_date||'-')}</strong></div></div></div></div>`}
function workitems(d){return `<div class="sectiontitle"><h2>${d.items.length} Item Pekerjaan</h2><button class="btn primary" onclick="openItemForm()">+ Tambah</button></div><div class="card tablecard"><div class="scroll"><table class="table"><thead><tr><th>No</th><th>Item Pekerjaan</th><th>Bobot</th><th>Urutan</th></tr></thead><tbody>${d.items.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.work_name)}</td><td>${pct(x.weight)}</td><td>${x.sort_order}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Belum ada item pekerjaan.</td></tr>'}</tbody></table></div></div>`}
function progressView(d){return `<div class="sectiontitle"><h2>Riwayat Progress</h2><span class="note">Input progress berikutnya kita aktifkan setelah modul dasar ini stabil.</span></div><div class="card tablecard"><div class="scroll"><table class="table"><thead><tr><th>Tanggal</th><th>Item</th><th>Progress</th><th>Catatan</th></tr></thead><tbody>${d.progress.map(p=>{const item=d.items.find(i=>i.id===p.work_item_id);return `<tr><td>${esc(p.progress_date)}</td><td>${esc(item?.work_name||p.work_item_id)}</td><td>${pct(p.progress_percentage)}</td><td>${esc(p.notes||'')}</td></tr>`}).join('')||'<tr><td colspan="4" class="empty">Belum ada progress.</td></tr>'}</tbody></table></div></div>`}
function rapView(d,s){const r=d.rap||{};return `<div class="sectiontitle"><h2>RAP Proyek</h2><button class="btn primary" onclick="openRapForm()">${d.rap?'Edit RAP':'Isi RAP'}</button></div><div class="cards" style="grid-template-columns:repeat(3,1fr)">${[['Material',r.material],['Upah',r.labor],['Alat',r.equipment],['Operasional',r.operational],['Subkon',r.subcontract],['Lain-Lain',r.other]].map(([k,v])=>`<div class="card kpi"><div class="label">${k.toUpperCase()}</div><div class="value">${money(v)}</div></div>`).join('')}</div><div class="section"><div class="card kpi"><div class="label">TOTAL RAP</div><div class="value">${money(s?.total_rap)}</div></div></div>`}
function financeView(d){return `<div class="sectiontitle"><h2>Transaksi Keuangan</h2><button class="btn primary" onclick="openTxForm()">+ Transaksi</button></div><div class="card tablecard"><div class="scroll"><table class="table"><thead><tr><th>Tanggal</th><th>Jenis</th><th>Kategori</th><th>Deskripsi</th><th>Jumlah</th><th>Metode</th></tr></thead><tbody>${d.fin.map(x=>`<tr><td>${esc(x.transaction_date)}</td><td>${esc(x.transaction_type)}</td><td>${esc(x.category||'')}</td><td>${esc(x.description)}</td><td>${money(x.amount)}</td><td>${esc(x.payment_method||'')}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Belum ada transaksi.</td></tr>'}</tbody></table></div></div>`}
function costView(d,s){const cats=[['Material','material','Material'],['Upah','labor','Upah'],['Alat','equipment','Alat-Alat'],['Operasional','operational','Operasional'],['Subkon','subcontract','SubKon'],['Lain-Lain','other','Lain-Lain']],r=d.rap||{};return `<div class="card tablecard"><div class="scroll"><table class="table"><thead><tr><th>Kategori</th><th>RAP</th><th>Realisasi</th><th>Selisih</th><th>% RAP Terpakai</th></tr></thead><tbody>${cats.map(([label,key,cat])=>{const rap=Number(r[key]||0),real=d.fin.filter(x=>x.transaction_type==='KELUAR'&&(x.category||'').toLowerCase()===cat.toLowerCase()).reduce((t,x)=>t+Number(x.amount||0),0);return `<tr><td>${label}</td><td>${money(rap)}</td><td>${money(real)}</td><td>${money(rap-real)}</td><td>${pct(rap?real/rap*100:0)}</td></tr>`}).join('')}</tbody></table></div></div><div class="section"><div class="cards" style="grid-template-columns:repeat(3,1fr)"><div class="card kpi"><div class="label">COST RATIO</div><div class="value">${pct(s?.cost_ratio)}</div></div><div class="card kpi"><div class="label">RAP CONSUMPTION</div><div class="value">${pct(s?.rap_consumption)}</div></div><div class="card kpi"><div class="label">ESTIMASI LABA</div><div class="value">${money(s?.estimated_profit)}</div></div></div></div>`}
function modal(title,body){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><h3>${title}</h3><button class="btn ghost" onclick="closeModal()">Tutup</button></div>${body}</div></div>`)}
function closeModal(){document.getElementById('modal')?.remove()}
function openProjectForm(){modal('Tambah Proyek',`<div class="formgrid"><div class="field"><label>Kode Proyek *</label><input id="f_code" placeholder="P26007"></div><div class="field"><label>Tanggal</label><input id="f_date" type="date" value="${today()}"></div><div class="field"><label>Nama Proyek *</label><input id="f_name"></div><div class="field"><label>Pemilik</label><input id="f_owner"></div><div class="field"><label>Kategori</label><input id="f_cat"></div><div class="field"><label>Lokasi</label><input id="f_loc"></div><div class="field"><label>Nilai Kontrak</label><input id="f_contract" type="number" min="0" value="0"></div><div class="field"><label>Project Manager</label><input id="f_mgr"></div><div class="field"><label>Tanggal Mulai</label><input id="f_start" type="date"></div><div class="field"><label>Target Selesai</label><input id="f_end" type="date"></div><div class="field"><label>Status</label><select id="f_status"><option>RENCANA</option><option>JALAN</option><option>PENDING</option><option>SELESAI</option></select></div></div><div class="formactions"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn primary" onclick="saveProject()">Simpan Proyek</button></div>`)}
async function saveProject(){const row={project_code:document.getElementById('f_code').value.trim(),project_date:document.getElementById('f_date').value||null,project_name:document.getElementById('f_name').value.trim(),owner_name:document.getElementById('f_owner').value.trim()||null,category:document.getElementById('f_cat').value.trim()||null,location:document.getElementById('f_loc').value.trim()||null,contract_value:Number(document.getElementById('f_contract').value||0),project_manager:document.getElementById('f_mgr').value.trim()||null,start_date:document.getElementById('f_start').value||null,end_date:document.getElementById('f_end').value||null,status:document.getElementById('f_status').value};if(!row.project_code||!row.project_name){toast('Kode dan nama proyek wajib diisi');return}const {data,error}=await sb.from('projects').insert(row).select().single();if(error){toast(error.message);return}closeModal();await loadSummary();toast('Proyek berhasil dibuat');await openProject(data.id)}
function openItemForm(){modal('Tambah Item Pekerjaan',`<div class="field"><label>Nama Item Pekerjaan *</label><input id="wi_name"></div><div class="formgrid"><div class="field"><label>Bobot (%) *</label><input id="wi_weight" type="number" min="0" max="100" step="0.01" value="0"></div><div class="field"><label>Urutan</label><input id="wi_sort" type="number" min="0" value="${state.detail.items.length+1}"></div></div><div class="field"><label>Catatan</label><textarea id="wi_notes"></textarea></div><div class="formactions"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn primary" onclick="saveItem()">Simpan Item</button></div>`)}
async function saveItem(){const row={project_id:state.selected,work_name:document.getElementById('wi_name').value.trim(),weight:Number(document.getElementById('wi_weight').value||0),sort_order:Number(document.getElementById('wi_sort').value||0),notes:document.getElementById('wi_notes').value.trim()||null};if(!row.work_name){toast('Nama item wajib diisi');return}const total=state.detail.items.reduce((s,x)=>s+Number(x.weight||0),0)+row.weight;if(total>100.0001){toast('Total bobot proyek tidak boleh lebih dari 100%');return}const {error}=await sb.from('project_work_items').insert(row);if(error){toast(error.message);return}closeModal();await loadSummary();await openProject(state.selected);toast('Item pekerjaan ditambahkan')}
function openRapForm(){const r=state.detail.rap||{};modal('RAP Proyek',`<div class="formgrid">${[['material','Material'],['labor','Upah'],['equipment','Alat'],['operational','Operasional'],['subcontract','Subkon'],['other','Lain-Lain']].map(([k,l])=>`<div class="field"><label>${l}</label><input id="rap_${k}" type="number" min="0" value="${Number(r[k]||0)}"></div>`).join('')}</div><div class="note">RAP V1.0 berada di level proyek, bukan per item pekerjaan.</div><div class="formactions"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn primary" onclick="saveRap()">Simpan RAP</button></div>`)}
async function saveRap(){const row={project_id:state.selected,material:Number(document.getElementById('rap_material').value||0),labor:Number(document.getElementById('rap_labor').value||0),equipment:Number(document.getElementById('rap_equipment').value||0),operational:Number(document.getElementById('rap_operational').value||0),subcontract:Number(document.getElementById('rap_subcontract').value||0),other:Number(document.getElementById('rap_other').value||0)};const {error}=await sb.from('project_rap').upsert(row,{onConflict:'project_id'});if(error){toast(error.message);return}closeModal();await loadSummary();await openProject(state.selected);toast('RAP berhasil disimpan')}
function openTxForm(){modal('Tambah Transaksi Keuangan',`<div class="formgrid"><div class="field"><label>Tanggal</label><input id="tx_date" type="date" value="${today()}"></div><div class="field"><label>Jenis</label><select id="tx_type"><option>MASUK</option><option>KELUAR</option></select></div><div class="field"><label>Kategori</label><input id="tx_cat" placeholder="Material / Upah / Uang Muka..."></div><div class="field"><label>Jumlah *</label><input id="tx_amount" type="number" min="1"></div><div class="field"><label>Metode</label><input id="tx_method" placeholder="Cash / Transfer"></div><div class="field"><label>Deskripsi *</label><input id="tx_desc"></div></div><div class="formactions"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn primary" onclick="saveTx()">Simpan Transaksi</button></div>`)}
async function saveTx(){const row={project_id:state.selected,transaction_date:document.getElementById('tx_date').value,transaction_type:document.getElementById('tx_type').value,category:document.getElementById('tx_cat').value.trim()||null,description:document.getElementById('tx_desc').value.trim(),amount:Number(document.getElementById('tx_amount').value||0),payment_method:document.getElementById('tx_method').value.trim()||null};if(!row.description||row.amount<=0){toast('Deskripsi dan jumlah wajib diisi');return}const {error}=await sb.from('financial_transactions').insert(row);if(error){toast(error.message);return}closeModal();await loadSummary();await openProject(state.selected);toast('Transaksi berhasil disimpan')}
boot();
</script></body></html>
