<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>SiKoyek V1.0</title>
<style>
:root{--bg:#f5f7fb;--surface:#fff;--text:#172033;--muted:#6b7280;--line:#e6eaf0;--primary:#1e5eff;--primary-soft:#eaf0ff;--success:#0f9d63;--success-soft:#e9f8f1;--warning:#b7791f;--warning-soft:#fff7df;--danger:#c53030;--danger-soft:#fff0f0}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input{font:inherit}.loading-screen{min-height:100vh;display:grid;place-items:center;color:var(--muted)}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;padding:32px;box-shadow:0 8px 30px rgba(23,32,51,.07)}.brand{font-weight:800;font-size:26px}.brand span{color:var(--primary)}.subtitle{color:var(--muted);margin:6px 0 28px}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input{width:100%;padding:12px 14px;border:1px solid #d9dee8;border-radius:10px}.btn{border:0;border-radius:10px;padding:12px 15px;cursor:pointer;font-weight:700}.btn-primary{background:var(--primary);color:#fff;width:100%;margin-top:8px}.error{margin-top:12px;color:var(--danger);font-size:13px}
.shell{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.sidebar{background:#111827;color:#fff;padding:22px 16px;display:flex;flex-direction:column}.side-brand{font-size:22px;font-weight:800;padding:4px 10px 24px}.side-brand span{color:#79a4ff}.nav{display:grid;gap:7px}.nav button{background:transparent;border:0;color:#cbd5e1;text-align:left;padding:11px 12px;border-radius:9px;cursor:pointer}.nav button.active,.nav button:hover{background:#1f2937;color:#fff}.side-bottom{margin-top:auto}.user-mini{font-size:12px;color:#cbd5e1;padding:12px}.content{padding:26px;overflow:auto}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.topbar h1{margin:0;font-size:28px}.topbar p{margin:5px 0 0;color:var(--muted)}.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--text)}.grid-kpi{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:16px}.kpi{padding:18px}.kpi .label{font-size:12px;color:var(--muted);font-weight:700}.kpi .value{font-size:24px;font-weight:800;margin-top:8px}.kpi .sub{font-size:12px;color:var(--muted);margin-top:4px}.section{margin-top:18px}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.section-title h2{margin:0;font-size:17px}.health-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.health{padding:18px}.health .n{font-size:28px;font-weight:800}.health .t{margin-top:4px;font-weight:700}.health.sehat{background:var(--success-soft)}.health.warning{background:var(--warning-soft)}.health.risk{background:var(--danger-soft)}.table-card{overflow:hidden}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px 14px;border-bottom:1px solid var(--line);font-size:13px;text-align:left;white-space:nowrap}.table th{background:#fafbfe;color:var(--muted);font-size:11px;text-transform:uppercase}.status{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800}.status.sehat{background:var(--success-soft);color:var(--success)}.status.warning{background:var(--warning-soft);color:var(--warning)}.status.risk{background:var(--danger-soft);color:var(--danger)}
@media(max-width:1100px){.grid-kpi{grid-template-columns:repeat(3,1fr)}}@media(max-width:780px){.shell{grid-template-columns:1fr}.sidebar{position:sticky;top:0;z-index:10;flex-direction:row;align-items:center;padding:12px}.side-brand{padding:0 12px}.nav{display:flex;overflow:auto}.side-bottom{display:none}.content{padding:18px}.grid-kpi,.health-grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid-kpi,.health-grid{grid-template-columns:1fr}.topbar{align-items:flex-start;gap:10px}.topbar h1{font-size:22px}}
</style>
</head>
<body><div id="app"><div class="loading-screen">Memuat SiKoyek...</div></div>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
const supabase=createClient('https://mmkusplegmittrlxqxby.supabase.co','sb_publishable_m9qLt2yxWi6i40bo9ixR5A_QIbOLoyf');
const app=document.getElementById('app');
const rupiah=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n||0));
const pct=n=>Number(n||0).toFixed(2)+'%';
const cls=s=>s==='SEHAT'?'sehat':s==='PERLU PENGAWASAN'?'warning':'risk';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function login(msg=''){app.innerHTML=`<div class="login-wrap"><div class="login-card"><div class="brand">Si<span>Koyek</span></div><div class="subtitle">Project Control System V1.0</div><div class="field"><label>Email</label><input id="email" type="email" placeholder="nama@perusahaan.com"></div><div class="field"><label>Password</label><input id="password" type="password" placeholder="••••••••"></div><button class="btn btn-primary" id="login">Masuk ke SiKoyek</button><div class="error" id="err">${esc(msg)}</div></div></div>`;document.getElementById('login').onclick=async()=>{const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password){document.getElementById('err').textContent='Email dan password wajib diisi.';return}const{error}=await supabase.auth.signInWithPassword({email,password});if(error)login(error.message)}}
async function load(){const{data,error}=await supabase.from('project_summary').select('*').order('project_code');if(error)throw error;return data||[]}
async function render(){const{data:{user}}=await supabase.auth.getUser();if(!user){login();return}try{const r=await load();const total=r.length,contract=r.reduce((a,x)=>a+Number(x.contract_value||0),0),rap=r.reduce((a,x)=>a+Number(x.total_rap||0),0),real=r.reduce((a,x)=>a+Number(x.cash_out||0),0),cashIn=r.reduce((a,x)=>a+Number(x.cash_in||0),0),progress=total?r.reduce((a,x)=>a+Number(x.project_progress||0),0)/total:0,h=r.reduce((a,x)=>{a[x.health_status]=(a[x.health_status]||0)+1;return a},{});app.innerHTML=`<div class="shell"><aside class="sidebar"><div class="side-brand">Si<span>Koyek</span></div><div class="nav"><button class="active">Dashboard</button><button>Projects</button><button>Progress</button><button>RAP</button><button>Keuangan</button><button>Cost Control</button></div><div class="side-bottom"><div class="user-mini">${esc(user.email)}</div><button class="nav btn" id="logout">Keluar</button></div></aside><main class="content"><div class="topbar"><div><h1>Dashboard</h1><p>Project Control & Management Information</p></div><button class="btn btn-ghost" id="refresh">Refresh Data</button></div><div class="grid-kpi"><div class="card kpi"><div class="label">TOTAL PROYEK</div><div class="value">${total}</div></div><div class="card kpi"><div class="label">NILAI KONTRAK</div><div class="value">${rupiah(contract)}</div></div><div class="card kpi"><div class="label">TOTAL RAP</div><div class="value">${rupiah(rap)}</div></div><div class="card kpi"><div class="label">REALISASI</div><div class="value">${rupiah(real)}</div></div><div class="card kpi"><div class="label">AVG. PROGRESS</div><div class="value">${pct(progress)}</div></div></div><div class="section"><div class="section-title"><h2>Project Health</h2></div><div class="health-grid"><div class="card health sehat"><div class="n">${h.SEHAT||0}</div><div class="t">SEHAT</div></div><div class="card health warning"><div class="n">${h['PERLU PENGAWASAN']||0}</div><div class="t">PERLU PENGAWASAN</div></div><div class="card health risk"><div class="n">${h.BERISIKO||0}</div><div class="t">BERISIKO</div></div></div></div><div class="section"><div class="section-title"><h2>Financial Position</h2></div><div class="grid-kpi"><div class="card kpi"><div class="label">CASH IN</div><div class="value">${rupiah(cashIn)}</div></div><div class="card kpi"><div class="label">CASH OUT</div><div class="value">${rupiah(real)}</div></div><div class="card kpi"><div class="label">NET CASHFLOW</div><div class="value">${rupiah(cashIn-real)}</div></div><div class="card kpi"><div class="label">RAP CONSUMPTION</div><div class="value">${pct(rap?real/rap*100:0)}</div></div></div></div><div class="section"><div class="section-title"><h2>Daftar Proyek</h2></div><div class="card table-card"><div class="table-wrap"><table class="table"><thead><tr><th>Proyek</th><th>Kontrak</th><th>Progress</th><th>Cost Ratio</th><th>RAP Consumption</th><th>Net Cashflow</th><th>Health</th></tr></thead><tbody>${r.map(x=>`<tr><td><strong>${esc(x.project_code)}</strong><br><span style="color:var(--muted)">${esc(x.project_name)}</span></td><td>${rupiah(x.contract_value)}</td><td>${pct(x.project_progress)}</td><td>${pct(x.cost_ratio)}</td><td>${pct(x.rap_consumption)}</td><td>${rupiah(x.net_cashflow)}</td><td><span class="status ${cls(x.health_status)}">${esc(x.health_status)}</span></td></tr>`).join('')}</tbody></table></div></div></div></main></div>`;document.getElementById('logout').onclick=async()=>{await supabase.auth.signOut();login()};document.getElementById('refresh').onclick=render}catch(e){login('Gagal memuat dashboard: '+e.message)}}
supabase.auth.onAuthStateChange(()=>render());render();
</script></body></html>
