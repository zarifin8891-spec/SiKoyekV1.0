<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>SiKoyek V1.0 — Project Control</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#687386;--line:#e5eaf1;--blue:#245cff;--blue2:#eaf0ff;--green:#11875d;--green2:#eaf8f2;--amber:#a56a00;--amber2:#fff6df;--red:#c73737;--red2:#fff0f0;--nav:#111827}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}.hidden{display:none!important}.muted{color:var(--muted)}
.login{min-height:100vh;display:grid;place-items:center;padding:24px}.loginbox{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:0 12px 36px #17203312}.brand{font-size:28px;font-weight:800}.brand b{color:var(--blue)}.loginbox h2{margin:8px 0 4px}.loginbox p{margin:0 0 24px;color:var(--muted)}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input{width:100%;padding:12px 13px;border:1px solid #d6dce6;border-radius:10px}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:750;cursor:pointer}.primary{background:var(--blue);color:#fff}.full{width:100%;margin-top:8px}.err{margin-top:12px;color:var(--red);font-size:13px}
.shell{min-height:100vh;display:grid;grid-template-columns:235px 1fr}.sidebar{background:var(--nav);color:#fff;padding:20px 14px;display:flex;flex-direction:column}.sidebrand{font-size:22px;font-weight:800;padding:5px 10px 22px}.sidebrand b{color:#7da2ff}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#cbd5e1;text-align:left;padding:11px 12px;border-radius:10px;cursor:pointer}.nav button.active,.nav button:hover{background:#202938;color:#fff}.sidefoot{margin-top:auto;padding:12px;color:#94a3b8;font-size:12px}.content{padding:26px;overflow:auto}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:20px}.top h1{margin:0;font-size:28px}.top p{margin:6px 0 0;color:var(--muted)}.actions{display:flex;gap:8px}.ghost{background:#fff;border:1px solid var(--line);color:var(--text)}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px}.kpi{padding:17px}.kpi .label{font-size:12px;color:var(--muted);font-weight:750}.kpi .value{font-size:23px;font-weight:850;margin-top:8px}.kpi .small{font-size:11px;color:var(--muted);margin-top:4px}.section{margin-top:18px}.sectiontitle{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.sectiontitle h2{font-size:17px;margin:0}.health{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.health .box{padding:18px;border-radius:16px;border:1px solid var(--line)}.box.green{background:var(--green2)}.box.amber{background:var(--amber2)}.box.red{background:var(--red2)}.big{font-size:29px;font-weight:850}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:850}.pill.green{background:var(--green2);color:var(--green)}.pill.amber{background:var(--amber2);color:var(--amber)}.pill.red{background:var(--red2);color:var(--red)}.tablecard{overflow:hidden}.scroll{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 13px;border-bottom:1px solid var(--line);font-size:13px;white-space:nowrap;text-align:left}.table th{font-size:10px;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;background:#fafbfd}.linkbtn{border:0;background:transparent;color:var(--blue);font-weight:800;cursor:pointer;padding:0}.bar{height:8px;background:#edf1f6;border-radius:999px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue)}
.detailhead{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.detailtitle h2{margin:0;font-size:23px}.detailtitle p{margin:5px 0;color:var(--muted)}.tabs{display:flex;gap:6px;overflow:auto;margin:18px 0}.tabs button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;cursor:pointer;font-weight:750;white-space:nowrap}.tabs button.active{background:var(--blue);border-color:var(--blue);color:#fff}.detailgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:15px}.empty{padding:28px;text-align:center;color:var(--muted)}.note{font-size:12px;color:var(--muted);margin-top:8px}.search{width:250px;max-width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
@media(max-width:1100px){.cards{grid-template-columns:repeat(3,1fr)}.detailgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:780px){.shell{grid-template-columns:1fr}.sidebar{position:sticky;top:0;z-index:5;flex-direction:row;align-items:center;padding:10px}.sidebrand{padding:0 10px}.nav{display:flex;overflow:auto}.sidefoot{display:none}.content{padding:17px}.health,.twocol{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}.detailhead{flex-direction:column}}@media(max-width:520px){.cards,.detailgrid{grid-template-columns:1fr}.top{flex-direction:column}.top h1{font-size:22px}}
</style>
</head>
<body>
<div id="app"><div class="login"><div class="loginbox"><div class="brand">SiKoyek <b>V1.0</b></div><h2>Project Control System</h2><p>Masuk untuk membuka dashboard proyek.</p><div class="field"><label>Email</label><input id="email" type="email" placeholder="nama@email.com"/></div><div class="field"><label>Password</label><input id="password" type="password" placeholder="••••••••"/></div><button class="btn primary full" id="loginBtn">Masuk</button><div id="loginErr" class="err"></div></div></div></div>
<script>
const SUPABASE_URL='https://mmkusplegmittrlxqxby.supabase.co';
const SUPABASE_KEY='sb_publishable_m9qLt2yxWi6i40bo9ixR5A_QIbOLoyf';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n||0));
const pct=n=>Number(n||0).toFixed(2)+'%';
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
let state={page:'dashboard',projects:[],summary:[],selected:null,detailTab:'overview'};
function healthClass(s){return s==='SEHAT'?'green':s==='BERISIKO'?'red':'amber'}
function nav(active){return `<aside class="sidebar"><div class="sidebrand">SiKoyek <b>V1.0</b></div><div class="nav"><button class="${active==='dashboard'?'active':''}" onclick="go('dashboard')">Dashboard</button><button class="${active==='projects'?'active':''}" onclick="go('projects')">Projects</button></div><div class="sidefoot">Project Control • V1.0</div></aside>`}
async function init(){const {data:{session}}=await sb.auth.getSession();renderRoot(session);sb.auth.onAuthStateChange((_e,s)=>renderRoot(s));}
async function renderRoot(session){if(!session){document.getElementById('app').innerHTML=document.getElementById('app').innerHTML.includes('loginbox')?document.getElementById('app').innerHTML:`<div class="login"><div class="loginbox"><div class="brand">SiKoyek <b>V1.0</b></div><h2>Project Control System</h2><p>Masuk untuk membuka dashboard proyek.</p><div class="field"><label>Email</label><input id="email" type="email" placeholder="nama@email.com"/></div><div class="field"><label>Password</label><input id="password" type="password" placeholder="••••••••"/></div><button class="btn primary full" id="loginBtn">Masuk</button><div id="loginErr" class="err"></div></div></div>`;document.getElementById('loginBtn').onclick=login;return}await loadSummary();renderApp()}
async function login(){const e=document.getElementById('email').value.trim(),p=document.getElementById('password').value;const {error}=await sb.auth.signInWithPassword({email:e,password:p});document.getElementById('loginErr').textContent=error?error.message:''}
async function logout(){await sb.auth.signOut();}
async function loadSummary(){const {data,error}=await sb.from('project_summary').select('*').order('project_code');if(error){console.error(error);state.summary=[];return}state.summary=data||[];state.projects=data||[]}
async function go(page){state.page=page;state.selected=null;await loadSummary();renderApp()}
function renderApp(){document.getElementById('app').innerHTML=`<div class="shell">${nav(state.page)}<main class="content"><div id="page"></div></main></div>`;renderPage()}
function renderPage(){const el=document.getElementById('page');if(state.page==='dashboard')el.innerHTML=dashboard();else if(state.page==='projects')el.innerHTML=projects();else el.innerHTML=detail()}
function dashboard(){const a=state.summary,total=arr=>arr.reduce((s,x)=>s+Number(x||0),0);const contracts=total(a.map(x=>x.contract_value)),rap=total(a.map(x=>x.total_rap)),real=total(a.map(x=>x.total_realization)),cin=total(a.map(x=>x.cash_in)),cout=total(a.map(x=>x.cash_out)),avg=a.length?total(a.map(x=>x.project_progress))/a.length:0;const g=a.filter(x=>x.health_status==='SEHAT').length,w=a.filter(x=>x.health_status==='PERLU PENGAWASAN').length,r=a.filter(x=>x.health_status==='BERISIKO').length;return `<div class="top"><div><h1>Dashboard</h1><p>Ringkasan kondisi portfolio proyek.</p></div><div class="actions"><button class="btn ghost" onclick="logout()">Keluar</button></div></div><div class="cards"><div class="card kpi"><div class="label">TOTAL PROYEK</div><div class="value">${a.length}</div></div><div class="card kpi"><div class="label">NILAI KONTRAK</div><div class="value">${money(contracts)}</div></div><div class="card kpi"><div class="label">TOTAL RAP</div><div class="value">${money(rap)}</div></div><div class="card kpi"><div class="label">TOTAL REALISASI</div><div class="value">${money(real)}</div></div><div class="card kpi"><div class="label">AVG PROGRESS</div><div class="value">${pct(avg)}</div></div></div><div class="section"><div class="health"><div class="box green"><div class="big">${g}</div><div>SEHAT</div></div><div class="box amber"><div class="big">${w}</div><div>PERLU PENGAWASAN</div></div><div class="box red"><div class="big">${r}</div><div>BERISIKO</div></div></div></div><div class="section"><div class="sectiontitle"><h2>Cashflow Portfolio</h2></div><div class="cards" style="grid-template-columns:repeat(3,1fr)"><div class="card kpi"><div class="label">CASH IN</div><div class="value">${money(cin)}</div></div><div class="card kpi"><div class="label">CASH OUT</div><div class="value">${money(cout)}</div></div><div class="card kpi"><div class="label">NET CASHFLOW</div><div class="value">${money(cin-cout)}</div></div></div></div><div class="section"><div class="sectiontitle"><h2>Project Health</h2><button class="linkbtn" onclick="go('projects')">Lihat semua →</button></div><div class="card tablecard"><div class="scroll"><table class="table"><thead><tr><th>Proyek</th><th>Progress</th><th>Cost Ratio</th><th>RAP Consumption</th><th>Status</th></tr></thead><tbody>${a.map(x=>`<tr><td><button class="linkbtn" onclick="openProject('${x.project_id}')">${esc(x.project_code)} — ${esc(x.project_name)}</button></td><td>${pct(x.project_progress)}</td><td>${pct(x.cost_ratio)}</td><td>${pct(x.rap_consumption)}</td><td><span class="pill ${healthClass(x.health_status)}">${esc(x.health_status)}</span></td></tr>`).join('')}</tbody></table></div></div></div>`}
function projects(){return `<div class="top"><div><h1>Projects</h1><p>Daftar proyek dan indikator kendalinya.</p></div><div class="actions"><button class="btn ghost" onclick="go('dashboard')">Dashboard</button><button class="btn ghost" onclick="logout()">Keluar</button></div></div><div class="card tablecard"><div class="scroll"><table class="table"><thead><tr><th>Kode</th><th>Nama Proyek</th><th>Kontrak</th><th>RAP</th><th>Progress</th><th>Cost Ratio</th><th>RAP Consumption</th><th>Health</th></tr></thead><tbody>${state.projects.map(x=>`<tr><td>${esc(x.project_code)}</td><td><button class="linkbtn" onclick="openProject('${x.project_id}')">${esc(x.project_name)}</button></td><td>${money(x.contract_value)}</td><td>${money(x.total_rap)}</td><td>${pct(x.project_progress)}</td><td>${pct(x.cost_ratio)}</td><td>${pct(x.rap_consumption)}</td><td><span class="pill ${healthClass(x.health_status)}">${esc(x.health_status)}</span></td></tr>`).join('')}</tbody></table></div></div>`}
async function openProject(id){state.selected=id;state.page='detail';state.detailTab='overview';renderApp();}
async function loadProject(id){const [{data:p},{data:w},{data:r},{data:f}]=await Promise.all([sb.from('projects').select('*').eq('id',id).single(),sb.from('project_work_items').select('*').eq('project_id',id).order('sort_order'),sb.from('project_rap').select('*').eq('project_id',id).maybeSingle(),sb.from('financial_transactions').select('*').eq('project_id',id).order('transaction_date',{ascending:false})]);const {data:pr}=await sb.from('progress_records').select('*').eq('project_id',id).order('progress_date',{ascending:true});return {p,w:w||[],r,f:f||[],pr:pr||[]}}
async function detail(){const s=state.summary.find(x=>x.project_id===state.selected);if(!s)return '<div class="empty">Proyek tidak ditemukan.</div>';const d=await loadProject(s.project_id);return `<div class="top"><div class="detailtitle"><h2>${esc(s.project_code)} — ${esc(s.project_name)}</h2><p>${esc(d.p.location||'')} • ${esc(d.p.status||'')}</p></div><div class="actions"><button class="btn ghost" onclick="go('projects')">← Projects</button><button class="btn ghost" onclick="logout()">Keluar</button></div></div><div class="detailgrid"><div class="card kpi"><div class="label">PROGRESS</div><div class="value">${pct(s.project_progress)}</div></div><div class="card kpi"><div class="label">COST RATIO</div><div class="value">${pct(s.cost_ratio)}</div></div><div class="card kpi"><div class="label">RAP CONSUMPTION</div><div class="value">${pct(s.rap_consumption)}</div></div><div class="card kpi"><div class="label">PROJECT HEALTH</div><div class="value"><span class="pill ${healthClass(s.health_status)}">${esc(s.health_status)}</span></div></div></div><div class="tabs">${['overview','work','progress','rap','finance','cost'].map(t=>`<button class="${state.detailTab===t?'active':''}" onclick="detailTab('${t}')">${({overview:'Overview',work:'Item Pekerjaan',progress:'Progress',rap:'RAP',finance:'Keuangan',cost:'Cost Control'})[t]}</button>`).join('')}</div><div id="detailbody">${detailBody(d,s)}</div>`}
function detailTab(t){state.detailTab=t;renderPage()}
function detailBody(d,s){if(state.detailTab==='overview')return `<div class="twocol"><div class="card kpi"><div class="label">INFORMASI PROYEK</div><div style="margin-top:12px;line-height:1.8"><b>${esc(d.p.project_name)}</b><br>Pemilik: ${esc(d.p.owner_name||'-')}<br>Lokasi: ${esc(d.p.location||'-')}<br>Manager: ${esc(d.p.project_manager||'-')}<br>Periode: ${esc(d.p.start_date||'-')} s/d ${esc(d.p.end_date||'-')}</div></div><div class="card kpi"><div class="label">KEUANGAN</div><div style="margin-top:12px;line-height:1.8">Nilai Kontrak: <b>${money(s.contract_value)}</b><br>Total RAP: <b>${money(s.total_rap)}</b><br>Realisasi: <b>${money(s.total_realization)}</b><br>Estimasi Laba: <b>${money(s.estimated_profit)}</b><br>Net Cashflow: <b>${money(s.net_cashflow)}</b></div></div></div>`;if(state.detailTab==='work')return `<div class="card tablecard"><div class="scroll"><table class="table"><thead><tr><th>No</th><th>Item Pekerjaan</th><th>Bobot</th></tr></thead><tbody>${d.w.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.work_name)}</td><td>${pct(x.weight)}</td></tr>`).join('')}</tbody></table></div><div class="note" style="padding:0 14px 14px">Total bobot proyek: ${pct(d.w.reduce((a,x)=>a+Number(x.weight||0),0))}</div></div>`;if(state.detailTab==='progress')return `<div class="card tablecard"><div class="scroll"><table class="table"><thead><tr><th>Tanggal</th><th>Item Pekerjaan</th><th>Progress Record</th></tr></thead><tbody>${d.pr.length?d.pr.map(x=>{const wi=d.w.find(v=>v.id===x.work_item_id);return `<tr><td>${esc(x.progress_date)}</td><td>${esc(wi?.work_name||'-')}</td><td>${pct(x.progress_percentage)}</td></tr>`}).join(''):'<tr><td colspan="3" class="empty">Belum ada progress.</td></tr>'}</tbody></table></div></div>`;if(state.detailTab==='rap')return `<div class="cards" style="grid-template-columns:repeat(3,1fr)"><div class="card kpi"><div class="label">MATERIAL</div><div class="value">${money(d.r?.material)}</div></div><div class="card kpi"><div class="label">UPAH</div><div class="value">${money(d.r?.labor)}</div></div><div class="card kpi"><div class="label">ALAT</div><div class="value">${money(d.r?.equipment)}</div></div><div class="card kpi"><div class="label">OPERASIONAL</div><div class="value">${money(d.r?.operational)}</div></div><div class="card kpi"><div class="label">SUBKON</div><div class="value">${money(d.r?.subcontract)}</div></div><div class="card kpi"><div class="label">LAIN-LAIN</div><div class="value">${money(d.r?.other)}</div></div></div>`;if(state.detailTab==='finance')return `<div class="card tablecard"><div class="scroll"><table class="table"><thead><tr><th>Tanggal</th><th>Tipe</th><th>Kategori</th><th>Keterangan</th><th>Jumlah</th><th>Metode</th></tr></thead><tbody>${d.f.length?d.f.map(x=>`<tr><td>${esc(x.transaction_date)}</td><td>${esc(x.transaction_type)}</td><td>${esc(x.category||'-')}</td><td>${esc(x.description)}</td><td>${money(x.amount)}</td><td>${esc(x.payment_method||'-')}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">Belum ada transaksi.</td></tr>'}</tbody></table></div></div>`;return `<div class="cards" style="grid-template-columns:repeat(3,1fr)"><div class="card kpi"><div class="label">NILAI KONTRAK</div><div class="value">${money(s.contract_value)}</div></div><div class="card kpi"><div class="label">REALISASI</div><div class="value">${money(s.total_realization)}</div></div><div class="card kpi"><div class="label">RAP</div><div class="value">${money(s.total_rap)}</div></div><div class="card kpi"><div class="label">COST RATIO</div><div class="value">${pct(s.cost_ratio)}</div><div class="small">Realisasi ÷ Nilai Kontrak</div></div><div class="card kpi"><div class="label">RAP CONSUMPTION</div><div class="value">${pct(s.rap_consumption)}</div><div class="small">Realisasi ÷ RAP</div></div><div class="card kpi"><div class="label">HEALTH</div><div class="value"><span class="pill ${healthClass(s.health_status)}">${esc(s.health_status)}</span></div><div class="small">${esc(s.control_message||'')}</div></div></div>`}
window.go=go;window.openProject=openProject;window.detailTab=detailTab;window.logout=logout;
document.getElementById('loginBtn').onclick=login;init();
</script>
</body>
</html>
