<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SiKoyek V1.0 — Project Control</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>














<link rel="stylesheet" href="./foundation/tokens.css">
<link rel="stylesheet" href="./foundation/dashboard.css">
<link rel="stylesheet" href="./foundation/project-control.css">
<link rel="stylesheet" href="./foundation/visual.css?v=17">
<script src="./environment.js"></script>
<script src="./foundation/config.js"></script>
<script src="./foundation/company-session.js"></script>
<script src="./foundation/runtime.js"></script>
<script src="./foundation/visual.js" defer></script>
<script src="./foundation/backend.js"></script>
<script src="./foundation/repository.js"></script>
<script src="./project-health-engine-v1.js"></script>
<script src="./project-decision-engine-v1.js"></script>

</head>
<body class="sk-theme"><div id="app"></div><script>
const sb=window.sb=window.SiKoyekBackend.getClient();
const money=n=>window.SiKoyekFoundation.money(n);
const moneyPlain=n=>window.SiKoyekFoundation.moneyPlain(n);
const pct=n=>Number(n||0).toFixed(2)+'%';
const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
let state={page:'dashboard',activeOnly:false,summary:[],selected:null,detailTab:'overview',detail:null,search:'',period:{from:'',to:''}};
function healthClass(s){return s==='SEHAT'?'green':s==='BERISIKO'?'red':'amber'}
function toast(msg){const d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function loginHTML(){return `<div class="login"><div class="loginbox"><div class="brand">SiKoyek <b>V 1.0</b></div><h2>Sistem Kontrol Proyek V1.0</h2><div class="field"><label>Email</label><input id="email" type="email" placeholder="nama@email.com" autocomplete="username"></div><div class="field"><label>Password</label><div class="password-wrap"><input id="password" type="password" placeholder="" autocomplete="current-password"><button id="togglePassword" class="toggle-password" type="button" aria-label="Tampilkan password" title="Tampilkan password"><svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.1 12s3.6-6 9.9-6 9.9 6 9.9 6-3.6 6-9.9 6-9.9-6-9.9-6Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg></button></div></div><button id="loginBtn" class="btn primary full" type="button">Masuk</button><div id="loginErr" class="err"></div><div class="forgot-wrap"><button id="forgotPassword" class="forgot-link" type="button">Lupa password?</button></div></div></div>`}
function togglePassword(){const input=document.getElementById('password'),btn=document.getElementById('togglePassword'),icon=document.getElementById('eyeIcon');if(!input)return;const show=input.type==='password';input.type=show?'text':'password';if(btn){btn.setAttribute('aria-label',show?'Sembunyikan password':'Tampilkan password');btn.title=show?'Sembunyikan password':'Tampilkan password'}if(icon){icon.innerHTML=show?'<path d="M3 3l18 18"></path><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path><path d="M9.9 5.1A10.9 10.9 0 0 1 12 5c6.3 0 9.9 7 9.9 7a18.6 18.6 0 0 1-3.1 3.8"></path><path d="M6.2 6.2C3.6 8.1 2.1 12 2.1 12a18.7 18.7 0 0 0 5.2 5.1A10.8 10.8 0 0 0 12 19c6.3 0 9.9-7 9.9-7"></path>':'<path d="M2.1 12s3.6-6 9.9-6 9.9 6 9.9 6-3.6 6-9.9 6-9.9-6-9.9-6Z"></path><circle cx="12" cy="12" r="2.5"></circle>'}}
async function enterAuthenticatedApp(user){
  if(SiKoyekCompanySession.enabled){
    let scope;
    try{scope=await SiKoyekCompanySession.identify(sb,user)}
    catch(error){
      await sb.auth.signOut({scope:'local'});
      location.replace('./multi-perusahaan/');
      return;
    }
    if(scope.account.access_role==='platform_admin'){location.replace('./multi-perusahaan/');return}
    window.SiKoyekCompanyIdentity=scope;
    window.__SIKOYEK_RBAC_PERMISSIONS_V6__=scope.permissions;
  }
  await SiKoyekControl.setIdentity(user);await loadSummary();renderApp()
}
async function login(){const btn=document.getElementById('loginBtn'),errEl=document.getElementById('loginErr');const email=document.getElementById('email').value.trim();const password=document.getElementById('password').value;if(!email||!password){errEl.textContent='Email dan password wajib diisi.';return}btn.disabled=true;btn.textContent='Memproses...';errEl.textContent='';try{const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;await enterAuthenticatedApp(data.user)}catch(error){errEl.textContent=error?.message||'Login gagal.';btn.disabled=false;btn.textContent='Masuk'}}
async function forgotPassword(){const email=document.getElementById('email')?.value.trim();const errEl=document.getElementById('loginErr');if(!email){errEl.textContent='Masukkan email terlebih dahulu untuk reset password.';return}const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+window.location.pathname});if(error){errEl.textContent=error.message;return}errEl.style.color='var(--green)';errEl.textContent='Link reset password sudah dikirim ke email.'}
async function logout(){await sb.auth.signOut();location.reload()}
function nav(active){return window.SiKoyekControl.nav(active)}
async function loadSummary(){const [{data,error},{data:projects,error:projectsError}]=await Promise.all([sb.from('project_summary').select('*').order('project_code'),sb.from('projects').select('id,project_date,start_date,end_date,location,status')]);if(error||projectsError){toast((error||projectsError).message);state.summary=[];return}const dates=Object.fromEntries((projects||[]).map(p=>[p.id,p]));state.summary=(data||[]).map(x=>({...x,...(dates[x.project_id]||{})}))}
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){if(SiKoyekCompanySession.enabled){location.replace('./multi-perusahaan/');return}document.getElementById('app').innerHTML=loginHTML();document.getElementById('togglePassword')?.addEventListener('click',togglePassword);document.getElementById('loginBtn')?.addEventListener('click',login);document.getElementById('forgotPassword')?.addEventListener('click',forgotPassword);document.getElementById('password')?.addEventListener('keydown',e=>{if(e.key==='Enter')login()});return}await enterAuthenticatedApp(session.user)}
async function go(page){state.page=page;state.selected=null;state.detail=null;await loadSummary();renderApp()}
function renderApp(){document.getElementById('app').innerHTML=`<div class="shell control-shell">${nav(state.page)}<main class="content"><div id="page"></div></main></div>`;renderPage()}
function renderPage(){const el=document.getElementById('page');if(state.page==='dashboard')window.SiKoyekControl.dashboard(el);else if(state.page==='projects')projects(el);else if(window.SiKoyekControl.isModule(state.page))window.SiKoyekControl.module(el,state.page);else renderDetail(el)}
function periodMatch(x){if(!state.period.from&&!state.period.to)return true;const start=x.start_date||x.project_date||'';const end=x.end_date||x.start_date||x.project_date||'';if(!start&&!end)return true;if(state.period.from&&end&&end<state.period.from)return false;if(state.period.to&&start&&start>state.period.to)return false;return true}
function formatDate(d){return SiKoyekFoundation.formatDate(d)}
function projects(root){SiKoyekControl.projectList(root,state.summary,state,{open:openProject,add:openProjectForm})}
async function openProject(id){state.page='detail';state.selected=id;state.detailTab='overview';state.detail=await getDetail(id);renderApp()}
async function getDetail(id){const [{data:project,error:e1},{data:items,error:e2},{data:rap,error:e3},{data:fin,error:e4},{data:progress,error:e5}]=await Promise.all([sb.from('projects').select('*').eq('id',id).single(),sb.from('project_work_items').select('*').eq('project_id',id).order('sort_order'),sb.from('project_rap').select('*').eq('project_id',id).maybeSingle(),sb.from('financial_transactions').select('*').eq('project_id',id).order('transaction_date',{ascending:false}),sb.from('progress_records').select('*').eq('project_id',id).order('progress_date',{ascending:false})]);const err=[e1,e2,e3,e4,e5].find(Boolean);if(err)toast(err.message);return {project,items:items||[],rap,fin:fin||[],progress:progress||[],financeReadError:e4||null,readError:err||null}}
function renderDetail(el){if(!state.detail){el.innerHTML='<div class="empty">Memuat proyek...</div>';return}const d=state.detail,s=state.summary.find(x=>x.project_id===state.selected);const labels={overview:'Overview',pekerjaan:'Item Pekerjaan',progress:'Progress',rap:'RAP',keuangan:'Keuangan',cost:'Cost Control',...(SiKoyekControl.canProgress()?SiKoyekControl.projectTabs:{})};el.innerHTML=`<div class="top sk-project-header"><div class="detailtitle"><h2>${esc(d.project.project_name)}</h2><p>${esc(d.project.project_code)} • ${esc(d.project.location||'-')} • ${esc(d.project.status)}</p></div><div class="actions"><button class="btn ghost" onclick="go('projects')">← Kembali</button><button class="btn primary" onclick="openItemForm()">+ Item Pekerjaan</button><button class="btn ghost" onclick="openTxForm()">+ Transaksi</button></div></div><div class="detailgrid"><div class="card kpi"><div class="label">NILAI KONTRAK</div><div class="value">${money(d.project.contract_value)}</div></div><div class="card kpi"><div class="label">RAP</div><div class="value">${money(s?.total_rap)}</div></div><div class="card kpi"><div class="label">PROGRESS</div><div class="value">${pct(s?.project_progress)}</div></div><div class="card kpi"><div class="label">HEALTH</div><div class="value"><span class="pill ${healthClass(s?.health_status)}">${esc(s?.health_status||'-')}</span></div></div></div><div class="tabs">${Object.entries(labels).map(([k,v])=>`<button class="${state.detailTab===k?'active':''}" onclick="setTab('${k}')">${v}</button>`).join('')}</div><div id="project-tab-content">${Object.hasOwn(SiKoyekControl.projectTabs,state.detailTab)?'':detailBody(d,s)}</div>`;if(Object.hasOwn(SiKoyekControl.projectTabs,state.detailTab))SiKoyekControl.mountProjectTab(el.querySelector('#project-tab-content'),state.detailTab,d.project)}
function setTab(t){state.detailTab=t;renderApp()}
function detailBody(d,s){if(state.detailTab==='overview')return overview(d,s);if(state.detailTab==='pekerjaan')return workitems(d);if(state.detailTab==='progress')return progressView(d);if(state.detailTab==='rap')return rapView(d,s);if(state.detailTab==='keuangan')return financeView(d);return costView(d,s)}
function overview(d,s){return `<div class="twocol"><div class="card kpi"><div class="sectiontitle"><h2>Progress</h2></div><div style="font-size:34px;font-weight:850">${pct(s?.project_progress)}</div><div class="bar" style="margin-top:12px"><i style="width:${Math.min(100,Number(s?.project_progress||0))}%"></i></div><div class="note">Progress dihitung dari bobot Item Pekerjaan.</div></div><div class="card kpi"><div class="sectiontitle"><h2>Biaya</h2></div><div class="note">Cost Ratio</div><div style="font-size:25px;font-weight:850">${pct(s?.cost_ratio)}</div><div class="note">RAP Consumption</div><div style="font-size:25px;font-weight:850">${pct(s?.rap_consumption)}</div></div></div><div class="section"><div class="card kpi"><div class="sectiontitle"><h2>Informasi Proyek</h2></div><div class="twocol"><div><div class="note">Pemilik</div><strong>${esc(d.project.owner_name||'-')}</strong></div><div><div class="note">Project Manager</div><strong>${esc(d.project.project_manager||'-')}</strong></div><div><div class="note">Mulai</div><strong>${formatDate(d.project.start_date)}</strong></div><div><div class="note">Target Selesai</div><strong>${formatDate(d.project.end_date)}</strong></div></div></div></div>`}
function workitems(d){return `<div class="sectiontitle"><h2>${d.items.length} Item Pekerjaan</h2><button class="btn primary" onclick="openItemForm()">+ Tambah</button></div><div class="card tablecard"><div class="scroll"><table class="table"><thead><tr><th>No</th><th>Item Pekerjaan</th><th>Bobot</th><th>Urutan</th><th>Durasi (hari)</th><th>Mulai Rencana</th></tr></thead><tbody>${d.items.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.work_name)}</td><td>${pct(Number(x.weight||0)*100)}</td><td>${x.sort_order}</td><td>${esc(x.duration_days ?? "—")}</td><td>${formatDate(x.planned_start_date)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Belum ada item pekerjaan.</td></tr>'}</tbody></table></div></div>`}
function progressView(d){return `<div class="sectiontitle"><h2>Riwayat Progress</h2><span class="note">Input progress berikutnya kita aktifkan setelah modul dasar ini stabil.</span></div><div class="card tablecard"><div class="scroll"><table class="table"><thead><tr><th>Tanggal</th><th>Item</th><th>Progress</th><th>Catatan</th></tr></thead><tbody>${d.progress.map(p=>{const item=d.items.find(i=>i.id===p.work_item_id);return `<tr><td>${formatDate(p.progress_date)}</td><td>${esc(item?.work_name||p.work_item_id)}</td><td>${pct(Number(p.progress_percentage||0)*100)}</td><td>${esc(p.notes||'')}</td></tr>`}).join('')||'<tr><td colspan="4" class="empty">Belum ada progress.</td></tr>'}</tbody></table></div></div>`}
function rapView(d,s){const r=d.rap||{};return `<div class="sectiontitle"><h2>RAP Proyek</h2><button class="btn primary" onclick="openRapForm()">${d.rap?'Edit RAP':'Isi RAP'}</button></div><div class="cards" style="grid-template-columns:repeat(3,1fr)">${[['Material',r.material],['Upah',r.labor],['Alat',r.equipment],['Operasional',r.operational],['Subkon',r.subcontract],['Lain-Lain',r.other]].map(([k,v])=>`<div class="card kpi"><div class="label">${k.toUpperCase()}</div><div class="value">${money(v)}</div></div>`).join('')}</div><div class="section"><div class="card kpi"><div class="label">TOTAL RAP</div><div class="value">${money(s?.total_rap)}</div></div></div>`}
function financeView(d){return `<div class="sectiontitle"><h2>Transaksi Keuangan</h2><button class="btn primary" onclick="openTxForm()">+ Transaksi</button></div><div class="card tablecard"><div class="scroll"><table class="table"><thead><tr><th>Tanggal</th><th>Jenis</th><th>Kategori</th><th>Deskripsi</th><th>Jumlah</th><th>Metode</th></tr></thead><tbody>${d.fin.map(x=>`<tr><td>${formatDate(x.transaction_date)}</td><td>${esc(x.transaction_type)}</td><td>${esc(x.category||'')}</td><td>${esc(x.description)}</td><td>${money(x.amount)}</td><td>${esc(x.payment_method||'')}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Belum ada transaksi.</td></tr>'}</tbody></table></div></div>`}
function costView(d){const cats=[['Material','material','Material'],['Upah','labor','Upah'],['Alat','equipment','Alat-Alat'],['Operasional','operational','Operasional'],['Subkon','subcontract','SubKon'],['Lain-Lain','other','Lain-Lain']],r=d.rap||{};return `<div class="card tablecard"><div class="scroll"><table class="table"><thead><tr><th>Kategori</th><th>RAP</th><th>Realisasi</th><th>Selisih</th><th>% RAP Terpakai</th></tr></thead><tbody>${cats.map(([label,key,cat])=>{const rap=Number(r[key]||0),real=d.fin.filter(x=>x.transaction_type==='KELUAR'&&(x.category||'').toLowerCase()===cat.toLowerCase()).reduce((t,x)=>t+Number(x.amount||0),0);return `<tr><td>${label}</td><td>${money(rap)}</td><td>${money(real)}</td><td>${money(rap-real)}</td><td>${pct(rap?real/rap*100:0)}</td></tr>`}).join('')}</tbody></table></div></div>`}
function modal(title,body){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><h3>${title}</h3><button class="btn ghost" onclick="closeModal()">Tutup</button></div>${body}</div></div>`)}
function closeModal(){document.getElementById('modal')?.remove()}
function openProjectForm(){modal('Tambah Proyek',`<div class="formgrid"><div class="field"><label>Kode Proyek *</label><input id="f_code" placeholder="P26007"></div><div class="field"><label>Tanggal</label><input id="f_date" type="date" value="${today()}"></div><div class="field"><label>Nama Proyek *</label><input id="f_name"></div><div class="field"><label>Pemilik</label><input id="f_owner"></div><div class="field"><label>Kategori</label><input id="f_cat"></div><div class="field"><label>Lokasi</label><input id="f_loc"></div><div class="field"><label>Nilai Kontrak</label><input id="f_contract" type="number" min="0" value="0"></div><div class="field"><label>Project Manager</label><input id="f_mgr"></div><div class="field"><label>Tanggal Mulai</label><input id="f_start" type="date"></div><div class="field"><label>Target Selesai</label><input id="f_end" type="date"></div><div class="field"><label>Status</label><select id="f_status"><option>RENCANA</option><option>JALAN</option><option>PENDING</option><option>SELESAI</option></select></div></div><div class="formactions"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn primary" onclick="saveProject()">Simpan Proyek</button></div>`)}
async function saveProject(){const row={project_code:document.getElementById('f_code').value.trim(),project_date:document.getElementById('f_date').value||null,project_name:document.getElementById('f_name').value.trim(),owner_name:document.getElementById('f_owner').value.trim()||null,category:document.getElementById('f_cat').value.trim()||null,location:document.getElementById('f_loc').value.trim()||null,contract_value:Number(document.getElementById('f_contract').value||0),project_manager:document.getElementById('f_mgr').value.trim()||null,start_date:document.getElementById('f_start').value||null,end_date:document.getElementById('f_end').value||null,status:document.getElementById('f_status').value};if(!row.project_code||!row.project_name){toast('Kode dan nama proyek wajib diisi');return}const {data,error}=await sb.from('projects').insert(row).select().single();if(error){toast(error.message);return}closeModal();await loadSummary();toast('Proyek berhasil dibuat');await openProject(data.id)}
function openItemForm(){modal('Tambah Item Pekerjaan',`<div class="field"><label>Nama Item Pekerjaan *</label><input id="wi_name"></div><div class="formgrid"><div class="field"><label>Bobot (%) *</label><input id="wi_weight" type="number" min="0" max="100" step="0.01" value="0"></div><div class="field"><label>Urutan</label><input id="wi_sort" type="number" min="0" value="${state.detail.items.length+1}"></div>${SiKoyekControl.itemScheduleFields('wi')}</div><div class="field"><label>Catatan</label><textarea id="wi_notes"></textarea></div><div class="formactions"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn primary" onclick="saveItem()">Simpan Item</button></div>`)}
async function saveItem(){const schedule=SiKoyekControl.readItemSchedule('wi');if(!schedule)return;const row={...schedule,project_id:state.selected,work_name:document.getElementById('wi_name').value.trim(),weight:Number(document.getElementById('wi_weight').value||0)/100,sort_order:Number(document.getElementById('wi_sort').value||0),notes:document.getElementById('wi_notes').value.trim()||null};if(!row.work_name){toast('Nama item wajib diisi');return}const total=state.detail.items.reduce((s,x)=>s+Number(x.weight||0),0)+row.weight;if(total>1.000001){toast('Total bobot proyek tidak boleh lebih dari 100%');return}const {error}=await sb.from('project_work_items').insert(row);if(error){toast(error.message);return}closeModal();await loadSummary();await openProject(state.selected);toast('Item pekerjaan ditambahkan')}
function openRapForm(){const r=state.detail.rap||{};modal('RAP Proyek',`<div class="formgrid">${[['material','Material'],['labor','Upah'],['equipment','Alat'],['operational','Operasional'],['subcontract','Subkon'],['other','Lain-Lain']].map(([k,l])=>`<div class="field"><label>${l}</label><input id="rap_${k}" type="number" min="0" value="${Number(r[k]||0)}"></div>`).join('')}</div><div class="note">RAP V1.0 berada di level proyek, bukan per item pekerjaan.</div><div class="formactions"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn primary" onclick="saveRap()">Simpan RAP</button></div>`)}
async function saveRap(){const row={project_id:state.selected,material:Number(document.getElementById('rap_material').value||0),labor:Number(document.getElementById('rap_labor').value||0),equipment:Number(document.getElementById('rap_equipment').value||0),operational:Number(document.getElementById('rap_operational').value||0),subcontract:Number(document.getElementById('rap_subcontract').value||0),other:Number(document.getElementById('rap_other').value||0)};const {error}=await sb.from('project_rap').upsert(row,{onConflict:'project_id'});if(error){toast(error.message);return}closeModal();await loadSummary();await openProject(state.selected);toast('RAP berhasil disimpan')}
function openTxForm(){modal('Tambah Transaksi Keuangan',`<div class="formgrid"><div class="field"><label>Tanggal</label><input id="tx_date" type="date" value="${today()}"></div><div class="field"><label>Jenis</label><select id="tx_type"><option>MASUK</option><option>KELUAR</option></select></div><div class="field"><label>Kategori</label><input id="tx_cat" placeholder="Material / Upah / Uang Muka..."></div><div class="field"><label>Jumlah *</label><input id="tx_amount" type="number" min="1"></div><div class="field"><label>Metode</label><input id="tx_method" placeholder="Cash / Transfer"></div><div class="field"><label>Deskripsi *</label><input id="tx_desc"></div></div><div class="formactions"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn primary" onclick="saveTx()">Simpan Transaksi</button></div>`)}
async function saveTx(){const row={project_id:state.selected,transaction_date:document.getElementById('tx_date').value,transaction_type:document.getElementById('tx_type').value,category:document.getElementById('tx_cat').value.trim()||null,description:document.getElementById('tx_desc').value.trim(),amount:Number(document.getElementById('tx_amount').value||0),payment_method:document.getElementById('tx_method').value.trim()||null};if(!row.description||row.amount<=0){toast('Deskripsi dan jumlah wajib diisi');return}const {error}=await sb.from('financial_transactions').insert(row);if(error){toast(error.message);return}closeModal();await loadSummary();await openProject(state.selected);toast('Transaksi berhasil disimpan')}
const appReady=boot();
</script>

</body>
